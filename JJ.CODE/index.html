<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Python Móvil - Prettier Theme</title>
  
  <link rel="icon" type="image/png" href="icono.png">
  <link rel="apple-touch-icon" href="icono.png">
  <link rel="manifest" href="manifest.json">
  
  <!-- CodeMirror -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/dialog/dialog.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/search/matchesonscrollbar.min.css">
  
  <!-- Skulpt -->
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
  
  <!-- Scripts CodeMirror -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/anyword-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/search/searchcursor.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      position: fixed;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #111B21;
      color: #E0E2E4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    .top-toolbar {
      flex-shrink: 0;
      background-color: #16242D;
      display: flex;
      align-items: center;
      padding: 10px 14px;
      gap: 10px;
      border-bottom: 1px solid #1A2B34;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #5C7482;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .icon-btn:active { color: #FF5198; }

    .search-pill {
      background-color: #1A2B34;
      border-radius: 20px;
      display: flex;
      align-items: center;
      padding: 4px 10px;
      flex: 1;
      gap: 6px;
      color: #5C7482;
      border: 1px solid transparent;
      transition: border-color 0.2s;
    }
    .search-pill:focus-within {
      border-color: #FF5198;
      background-color: #131E25;
    }

    .search-pill input {
      background: transparent;
      border: none;
      outline: none;
      color: #E0E2E4;
      width: 100%;
      font-size: 13px;
      font-family: monospace;
    }

    .search-badge {
      font-size: 11px;
      color: #28C0A9;
      font-family: monospace;
      white-space: nowrap;
      padding: 2px 4px;
      border-radius: 4px;
      background: #111B21;
      display: none;
    }

    .btn-ejecutar-play {
      background-color: #FF5198;
      color: white;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(255, 81, 152, 0.4);
      flex-shrink: 0;
    }
    .btn-ejecutar-play:active { transform: scale(0.92); background-color: #E03E7E; }

    /* Barra de pestañas múltiples */
    .tab-bar {
      flex-shrink: 0;
      background-color: #111B21;
      display: flex;
      align-items: center;
      overflow-x: auto;
      border-bottom: 1px solid #1A2B34;
      -webkit-overflow-scrolling: touch;
    }
    .tab-bar::-webkit-scrollbar { display: none; }

    .tab {
      background-color: #16242D;
      color: #8198a5;
      padding: 8px 14px;
      font-family: monospace;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-right: 1px solid #111B21;
      border-top: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }

    .tab.activa {
      background-color: #1A2B34;
      color: #3CA9E2;
      border-top: 2px solid #FF5198;
    }

    .tab .btn-cerrar-tab {
      font-size: 11px;
      color: #5C7482;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .tab .btn-cerrar-tab:hover {
      color: #FF5198;
      background-color: rgba(255, 81, 152, 0.1);
    }

    .btn-nueva-pestana {
      background: none;
      border: none;
      color: #3CA9E2;
      font-size: 16px;
      padding: 6px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .btn-nueva-pestana:active { color: #FF5198; }

    .editor-container {
      flex: 1;
      position: relative;
      background-color: #1A2B34;
      overflow: hidden;
    }

    .CodeMirror {
      height: 100% !important;
      position: absolute !important;
      top: 0; bottom: 0; left: 0; right: 0;
      font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
    }

    .cm-searching {
      background-color: rgba(255, 81, 152, 0.35) !important;
      border-bottom: 2px solid #FF5198;
    }

    /* Prettier Theme */
    .cm-s-prettier.CodeMirror { background: #1A2B34; color: #E0E2E4; }
    .cm-s-prettier .CodeMirror-gutters { background: #1A2B34; border-right: 1px solid #233642; }
    .cm-s-prettier .CodeMirror-linenumber { color: #5C7482; }
    .cm-s-prettier .CodeMirror-cursor { border-left: 2px solid #FF5198; }
    .cm-s-prettier span.cm-keyword { color: #FF5198; font-weight: bold; }
    .cm-s-prettier span.cm-string { color: #28C0A9; }
    .cm-s-prettier span.cm-number { color: #E09873; }
    .cm-s-prettier span.cm-def { color: #3CA9E2; }
    .cm-s-prettier span.cm-variable { color: #E0E2E4; }
    .cm-s-prettier span.cm-variable-2 { color: #33CCFF; }
    .cm-s-prettier span.cm-comment { color: #697A85; font-style: italic; }
    .cm-s-prettier span.cm-operator { color: #FF5198; }
    .cm-s-prettier span.cm-builtin { color: #3CA9E2; }

    .console-section {
      flex-shrink: 0;
      height: 48%;
      background-color: #0B1216;
      border-top: 1px solid #233642;
      display: flex;
      flex-direction: column;
      transition: height 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .console-section.oculta { height: 38px; }

    .console-header {
      flex-shrink: 0;
      height: 38px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      font-size: 12px;
      color: #5C7482;
      border-bottom: 1px solid #111B21;
      user-select: none;
    }

    .console-body {
      flex: 1;
      padding: 10px 14px;
      font-family: 'SF Mono', Menlo, monospace;
      font-size: 13px;
      color: #E0E2E4;
      overflow-y: auto;
      white-space: pre-wrap;
      -webkit-overflow-scrolling: touch;
      cursor: text;
    }

    .bottom-bar {
      flex-shrink: 0;
      height: 28px;
      background-color: #111B21;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #3CA9E2;
      font-family: monospace;
      border-top: 1px solid #1A2B34;
    }

    .terminal-input {
      background: transparent;
      border: none;
      outline: none;
      color: #28C0A9;
      font-family: monospace;
      font-size: 13px;
      width: 140px;
      margin-left: 2px;
    }

    .sidebar-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      z-index: 9998;
      display: none;
      backdrop-filter: blur(2px);
    }
    .sidebar-overlay.activo { display: block; }

    .sidebar {
      position: fixed;
      top: 0; left: -300px; width: 290px; height: 100vh;
      background-color: #111B21;
      border-right: 1px solid #1A2B34;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease-out;
    }
    .sidebar.abierto { transform: translateX(300px); }

    .sidebar-header {
      padding: 16px 14px;
      font-size: 13px;
      font-weight: bold;
      color: #8198a5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1A2B34;
      background-color: #16242D;
    }

    .sidebar-actions {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      background-color: #111B21;
      border-bottom: 1px solid #1A2B34;
    }

    .sidebar-btn {
      flex: 1;
      background: #1A2B34;
      color: #E0E2E4;
      border: 1px solid #233642;
      padding: 8px 6px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
      text-align: center;
    }
    .sidebar-btn:active { background: #FF5198; color: white; }

    .file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      -webkit-overflow-scrolling: touch;
    }

    /* Elementos del árbol con soporte Long-Press */
    .tree-folder, .tree-file {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .tree-folder {
      font-size: 13px;
      color: #FF5198;
      font-weight: bold;
      padding: 8px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 6px;
      margin-top: 4px;
      cursor: pointer;
      background: rgba(22, 36, 45, 0.5);
    }
    .tree-folder:active { background: #16242D; }

    .tree-folder-left {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .folder-arrow {
      font-size: 11px;
      color: #3CA9E2;
      width: 14px;
      display: inline-block;
      text-align: center;
    }

    .folder-children {
      margin-left: 10px;
      padding-left: 6px;
      border-left: 1px dashed #233642;
      display: flex;
      flex-direction: column;
    }
    .folder-children.colapsado { display: none; }

    .tree-file {
      font-size: 13px;
      color: #E0E2E4;
      padding: 9px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      margin: 2px 0;
      background: #16242D;
    }
    .tree-file:active { background-color: #233642; }

    .tree-file.activo {
      background-color: #1A2B34;
      color: #3CA9E2;
      border-left: 3px solid #FF5198;
    }

    .tree-file-sub {
      background: #131E25;
      font-size: 12px;
    }

    .tree-empty-folder {
      font-size: 11px;
      color: #5C7482;
      padding: 6px 10px;
      font-style: italic;
    }

    /* Modales */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.activo { display: flex; }

    .modal-box {
      background-color: #16242D;
      border: 1px solid #1A2B34;
      border-radius: 12px;
      width: 100%;
      max-width: 340px;
      padding: 18px;
      color: #E0E2E4;
    }
    .modal-box h3 {
      font-size: 15px;
      color: #28C0A9;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    .modal-input-group label {
      font-size: 12px;
      color: #8198a5;
    }
    .modal-input-group input, .modal-input-group select {
      background: #111B21;
      border: 1px solid #233642;
      color: #E0E2E4;
      padding: 8px 10px;
      border-radius: 6px;
      outline: none;
      font-family: monospace;
      font-size: 13px;
    }
    .modal-input-group input:focus, .modal-input-group select:focus {
      border-color: #FF5198;
    }

    .modal-btn-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .modal-btn {
      flex: 1;
      background: #FF5198;
      border: none;
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }
    .modal-btn.secondary {
      background: #1A2B34;
      border: 1px solid #233642;
      color: #3CA9E2;
    }
    .modal-btn:active { opacity: 0.85; }

    /* Menú Contextual (Long Press) */
    .context-menu-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .context-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #111B21;
      border: 1px solid #233642;
      color: #E0E2E4;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }
    .context-btn:active { background: #1A2B34; }
    .context-btn.danger { color: #FF5198; border-color: rgba(255, 81, 152, 0.3); }
    .context-btn.danger:active { background: rgba(255, 81, 152, 0.15); }
  </style>
</head>
<body>

  <!-- Overlay y Sidebar -->
  <div class="sidebar-overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span>EXPLORADOR DE ARCHIVOS</span>
      <span id="btnCerrarSidebar" style="cursor: pointer; font-size: 16px; padding: 4px;">✕</span>
    </div>
    <div class="sidebar-actions">
      <button class="sidebar-btn" id="btnAbrirModalArchivo">📄 + Archivo</button>
      <button class="sidebar-btn" id="btnCrearCarpeta">📁 + Carpeta</button>
    </div>
    <div class="file-tree" id="listaArchivos"></div>
  </aside>

  <!-- Modal Crear Archivo -->
  <div class="modal-overlay" id="modalCrearArchivo">
    <div class="modal-box">
      <h3>Crear Archivo <span id="btnCerrarModalArchivo" style="cursor:pointer; color:#FF5198;">✕</span></h3>
      <div class="modal-input-group">
        <label>Nombre del archivo:</label>
        <input type="text" id="nuevoNombreArchivo" placeholder="ej: script.py" autocomplete="off">
      </div>
      <div class="modal-input-group">
        <label>Guardar en carpeta:</label>
        <select id="selectorCarpetaDestino">
          <option value="">/ (Raíz)</option>
        </select>
      </div>
      <div class="modal-btn-group">
        <button class="modal-btn secondary" id="btnSoloCrear">Crear</button>
        <button class="modal-btn" id="btnCrearYAbrir">Abrir</button>
      </div>
    </div>
  </div>

  <!-- Modal Abrir Pestaña (+) -->
  <div class="modal-overlay" id="modalAbrirPestana">
    <div class="modal-box">
      <h3>Abrir Archivo en Pestaña <span id="btnCerrarModalPestana" style="cursor:pointer; color:#FF5198;">✕</span></h3>
      <div class="modal-input-group">
        <label>Selecciona la carpeta:</label>
        <select id="selectorCarpetaPestana">
          <option value="TODAS">📁 Todas las ubicaciones</option>
          <option value="">/ (Raíz)</option>
        </select>
      </div>
      <div class="modal-input-group">
        <label>Selecciona el archivo:</label>
        <select id="selectorArchivoPestana"></select>
      </div>
      <button class="modal-btn" id="btnConfirmarAbrirPestana">Abrir</button>
    </div>
  </div>

  <!-- Modal Menú Contextual (Long Press) -->
  <div class="modal-overlay" id="modalContextual">
    <div class="modal-box">
      <h3 id="contextualTitulo">Opciones <span id="btnCerrarContextual" style="cursor:pointer; color:#FF5198;">✕</span></h3>
      <p id="contextualSubtitulo" style="font-size: 12px; color: #8198a5; margin-bottom: 12px; word-break: break-all;"></p>
      <div class="context-menu-actions">
        <button class="context-btn" id="btnCtxCompartir">📤 Compartir / Exportar</button>
        <button class="context-btn" id="btnCtxDescargar">⬇️ Descargar archivo</button>
        <button class="context-btn danger" id="btnCtxEliminar">🗑 Eliminar</button>
      </div>
    </div>
  </div>

  <!-- Modal Diagnóstico / Listo -->
  <div class="modal-overlay" id="modalListo">
    <div class="modal-box">
      <h3>Estado del Entorno <span id="btnCerrarModal" style="cursor:pointer; color:#FF5198;">✕</span></h3>
      <div class="modal-info" id="infoDiagnostico" style="font-size:13px; line-height:1.6; color:#9ba1b0; margin-bottom:14px;"></div>
      <button class="modal-btn" id="btnReiniciarMotor" style="width:100%;">🔄 Reiniciar Motor y Variables</button>
    </div>
  </div>

  <div class="app-wrapper">
    <header class="top-toolbar">
      <button class="icon-btn" id="btnCarpeta" title="Ver Archivos">📁</button>
      <button class="icon-btn" id="btnRamas">🔀</button>
      
      <div class="search-pill">
        <span>🔍</span>
        <input type="text" id="buscadorInput" placeholder="Buscar..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <span class="search-badge" id="badgeCoincidencias">0/0</span>
      </div>

      <button class="btn-ejecutar-play" id="btnEjecutar" title="Ejecutar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="icon-btn" id="btnOpciones">•••</button>
    </header>

    <!-- Contenedor dinámico de pestañas múltiples -->
    <div class="tab-bar" id="contenedorPestanas"></div>

    <div class="editor-container">
      <textarea id="codigo"></textarea>
    </div>

    <!-- Terminal -->
    <section class="console-section" id="seccionConsola">
      <div class="console-header">
        <span style="font-weight: bold; color: #8198a5;">🖥 Consola</span>
        <div style="display: flex; gap: 14px; align-items: center;">
          <span id="estadoMotor" style="color: #28C0A9; font-size: 11px; cursor: pointer;">Listo ⚙️</span>
          <span id="btnLimpiarConsola" style="cursor: pointer; font-size: 14px;" title="Limpiar">🗑</span>
          <span id="flechaConsola" style="cursor: pointer; font-size: 14px; padding: 4px;" title="Ocultar / Mostrar">🔽</span>
        </div>
      </div>
      
      <div class="console-body" id="salidaConsola"></div>
      
      <div class="bottom-bar">
        <span id="posicionCursor">&lt;/&gt; Python Lín 1, Col 1</span>
        <span id="estadoInferior" style="cursor: pointer; color: #28C0A9;">Listo</span>
      </div>
    </section>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // Persistencia Local
    let sistemaArchivos = JSON.parse(localStorage.getItem('py_archivos')) || {
      "prueba.py": "nombre = input('Ingresa tu nombre: ')\nprint(f'Hola {nombre}, bienvenido.')",
      "ayuda.py": "# Archivo secundario para practicar con pestañas\ndef sumar(a, b):\n    return a + b\n\nprint('Total:', sumar(10, 5))"
    };
    let carpetasCreadas = JSON.parse(localStorage.getItem('py_carpetas')) || ["modulos"];
    let carpetasEstado = JSON.parse(localStorage.getItem('py_carpetas_estado')) || {};
    let pestanasAbiertas = JSON.parse(localStorage.getItem('py_pestanas')) || ["prueba.py", "ayuda.py"];
    let archivoActual = localStorage.getItem('py_archivo_activo') || "prueba.py";

    // Validaciones iniciales
    if (!sistemaArchivos[archivoActual]) archivoActual = Object.keys(sistemaArchivos)[0] || "prueba.py";
    pestanasAbiertas = pestanasAbiertas.filter(p => sistemaArchivos[p]);
    if (!pestanasAbiertas.includes(archivoActual)) pestanasAbiertas.push(archivoActual);

    const salidaConsola = document.getElementById("salidaConsola");
    
    const editor = CodeMirror.fromTextArea(document.getElementById("codigo"), {
      mode: "python", 
      theme: "prettier", 
      lineNumbers: true, 
      lineWrapping: true, 
      autoCloseBrackets: true,
      inputStyle: "contenteditable",
      extraKeys: {"Ctrl-Space": "autocomplete"}
    });

    editor.setValue(sistemaArchivos[archivoActual] || "");

    editor.on("change", () => {
      if (archivoActual) {
        sistemaArchivos[archivoActual] = editor.getValue();
        localStorage.setItem('py_archivos', JSON.stringify(sistemaArchivos));
      }
      if (document.getElementById('buscadorInput').value.trim() !== '') {

        const primera = Object.keys(sistemaArchivos)[0];
        if (primera) pestanasAbiertas.push(primera);

      if (archivoActual === ruta) {
        cambiarPestana(pestanasAbiertas[pestanasAbiertas.length - 1]);

        renderizarPestanas();

    function procesarCreacionArchivo(abrirAlFinal = false) {
      let nombre = document.getElementById('nuevoNombreArchivo').value.trim();

      if (!nombre) return alert("Escribe un nombre para el archivo.");
      if (!nombre.endsWith('.py')) nombre += '.py';

        renderizarArchivos();
        alert(`Archivo "${rutaCompleta}" creado correctamente.`);
      }
    }

    // --- HELPER: DETECTOR DE LONG PRESS (500ms) ---
    function configurarLongPress(elemento, callbackClick, callbackLongPress) {
      let pressTimer = null;
      let ejecutoLongPress = false;
      let startX = 0, startY = 0;

      const inicio = (e) => {
        ejecutoLongPress = false;
        if (e.touches && e.touches.length > 0) {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
        }
        pressTimer = setTimeout(() => {
          ejecutoLongPress = true;
          if (navigator.vibrate) navigator.vibrate(45);
          callbackLongPress(e);
        }, 500);
      };

      const movimiento = (e) => {
        if (!pressTimer) return;
        if (e.touches && e.touches.length > 0) {
          const diffX = Math.abs(e.touches[0].clientX - startX);
          const diffY = Math.abs(e.touches[0].clientY - startY);
          if (diffX > 8 || diffY > 8) {
            clearTimeout(pressTimer);
            pressTimer = null;
          }
        }
      };

      const cancelar = () => {
        if (pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }
      };

      const fin = (e) => {
        if (pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }
        if (!ejecutoLongPress && callbackClick) {
          callbackClick(e);
        }
      };

      // Eventos táctiles
      elemento.addEventListener('touchstart', inicio, { passive: true });
      elemento.addEventListener('touchmove', movimiento, { passive: true });
      elemento.addEventListener('touchend', fin);
      elemento.addEventListener('touchcancel', cancelar);

      // Eventos de ratón
      elemento.addEventListener('mousedown', (e) => { if (e.button === 0) inicio(e); });
      elemento.addEventListener('mousemove', movimiento);
      elemento.addEventListener('mouseup', fin);
      elemento.addEventListener('mouseleave', cancelar);

      // Desactivar menú contextual nativo de Safari
      elemento.addEventListener('contextmenu', (e) => e.preventDefault());
    }

    // --- MENÚ CONTEXTUAL / ACCIONES ---
    let elementoContextual = { tipo: '', ruta: '' };

    function abrirMenuContextual(tipo, ruta) {

      document.getElementById('btnCerrarContextual').onclick = () => {

    async function ejecutarCompartirContextual() {
      const { tipo, ruta } = elementoContextual;
      document.getElementById('modalContextual').classList.remove('activo');

      if (tipo === 'archivo') {
        const contenido = sistemaArchivos[ruta] || "";
        if (navigator.share) {
          try {
            const nombreArchivo = ruta.split('/').pop();
            const file = new File([contenido], nombreArchivo, { type: 'text/x-python' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({ files: [file], title: nombreArchivo });
            } else {
              await navigator.share({ title: nombreArchivo, text: contenido });
            }
          } catch (e) {
            if (e.name !== 'AbortError') alert("Error al compartir: " + e.message);
          }
        } else {
          navigator.clipboard.writeText(contenido).then(() => {
            alert("Código copiado al portapapeles.");
          });
        }
      } else {
        const archivosCarpeta = {};
        for (let k in sistemaArchivos) {
          if (k.startsWith(ruta + '/')) archivosCarpeta[k] = sistemaArchivos[k];
        }
        const dataJson = JSON.stringify(archivosCarpeta, null, 2);
        if (navigator.share) {
          try {
            await navigator.share({ title: `Carpeta ${ruta}`, text: dataJson });
          } catch (e) {
            if (e.name !== 'AbortError') alert("Error al compartir: " + e.message);
          }
        } else {
          navigator.clipboard.writeText(dataJson).then(() => {
            alert("Archivos de la carpeta copiados al portapapeles en formato JSON.");
          });
        }
      }
    }

    function ejecutarDescargarContextual() {
      const { tipo, ruta } = elementoContextual;
      document.getElementById('modalContextual').classList.remove('activo');

      if (tipo === 'archivo') {
        const contenido = sistemaArchivos[ruta] || "";
        const blob = new Blob([contenido], { type: 'text/x-python;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = ruta.split('/').pop();
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } else {
        const archivosCarpeta = {};
        for (let k in sistemaArchivos) {
          if (k.startsWith(ruta + '/')) archivosCarpeta[k] = sistemaArchivos[k];
        }
        const blob = new Blob([JSON.stringify(archivosCarpeta, null, 2)], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${ruta}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }
    }

    function renderizarArchivos() {
      const contenedor = document.getElementById('listaArchivos');
      contenedor.innerHTML = '';

      // 1. Renderizar Carpetas y sus subarchivos
      carpetasCreadas.forEach(carpeta => {
        const estaAbierta = carpetasEstado[carpeta] !== false; // por defecto abierta

        const folderWrap = document.createElement('div');
        folderWrap.style.marginBottom = '6px';

        const folderHead = document.createElement('div');
        folderHead.className = 'tree-folder';
        folderHead.innerHTML = `
          <div class="tree-folder-left">
            <span class="folder-arrow">${estaAbierta ? '▾' : '▸'}</span>
            <span>📁 ${carpeta}</span>
          </div>
          <span style="font-size:10px; color:#5C7482; padding-right:4px;">•••</span>
        `;

        configurarLongPress(
          folderHead,
          () => {
            // Click normal: Colapsar / Expandir
            carpetasEstado[carpeta] = !estaAbierta;
            localStorage.setItem('py_carpetas_estado', JSON.stringify(carpetasEstado));
            renderizarArchivos();
          },
          () => {
            // Long Press: Opciones contextuales
            abrirMenuContextual('carpeta', carpeta);
          }
        );

        folderWrap.appendChild(folderHead);

        const subFilesContainer = document.createElement('div');
        subFilesContainer.className = `folder-children ${estaAbierta ? '' : 'colapsado'}`;

        const archivosDeEstaCarpeta = Object.keys(sistemaArchivos).filter(k => k.startsWith(carpeta + '/'));

        if (archivosDeEstaCarpeta.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'tree-empty-folder';
          empty.textContent = '(Carpeta vacía)';
          subFilesContainer.appendChild(empty);
        } else {
          archivosDeEstaCarpeta.forEach(ruta => {
            const nombreArchivo = ruta.replace(carpeta + '/', '');
            const fileItem = document.createElement('div');
            fileItem.className = `tree-file tree-file-sub ${ruta === archivoActual ? 'activo' : ''}`;
            fileItem.innerHTML = `
              <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">📄 ${nombreArchivo}</span>
            `;

            configurarLongPress(
              fileItem,
              () => {
                abrirEnPestana(ruta);
                toggleSidebar();
              },
              () => {
                abrirMenuContextual('archivo', ruta);
              }
            );

            subFilesContainer.appendChild(fileItem);
          });
        }

        folderWrap.appendChild(subFilesContainer);
        contenedor.appendChild(folderWrap);
      });

      // 2. Renderizar Archivos en Raíz (sin carpeta)
      const archivosRaiz = Object.keys(sistemaArchivos).filter(k => !k.includes('/'));
      if (archivosRaiz.length > 0) {
        const rootHeader = document.createElement('div');
        rootHeader.style.cssText = 'font-size:11px; color:#5C7482; font-weight:bold; margin: 10px 0 4px 6px; text-transform:uppercase;';
        rootHeader.textContent = 'Raíz';
        contenedor.appendChild(rootHeader);

        archivosRaiz.forEach(ruta => {
          const fileItem = document.createElement('div');
          fileItem.className = `tree-file ${ruta === archivoActual ? 'activo' : ''}`;
          fileItem.innerHTML = `
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">📄 ${ruta}</span>
          `;

          configurarLongPress(
            fileItem,
            () => {
              abrirEnPestana(ruta);
              toggleSidebar();
            },
            () => {
              abrirMenuContextual('archivo', ruta);
            }
          );

          contenedor.appendChild(fileItem);
        });
      }
    }

    function crearCarpetaPrompt() {
      const nombre = prompt("Nombre de la nueva carpeta:");
      if (!nombre) return;
      const nombreLimpio = nombre.replace(/[^\w-]/gi, '').trim();
      if (!nombreLimpio) return alert("Nombre de carpeta inválido.");
      if (!carpetasCreadas.includes(nombreLimpio)) {
        carpetasCreadas.push(nombreLimpio);
        carpetasEstado[nombreLimpio] = true;
        localStorage.setItem('py_carpetas', JSON.stringify(carpetasCreadas));
        localStorage.setItem('py_carpetas_estado', JSON.stringify(carpetasEstado));
        renderizarArchivos();
      }
    }

    function eliminarArchivo(ruta) {
      if (Object.keys(sistemaArchivos).length <= 1) return alert("Debes conservar al menos un archivo.");
      if (confirm(`¿Eliminar ${ruta}?`)) {
        delete sistemaArchivos[ruta];
        localStorage.setItem('py_archivos', JSON.stringify(sistemaArchivos));
        cerrarPestana(ruta);
        renderizarArchivos();
      }
    }

    function eliminarCarpeta(carpeta) {
      if (confirm(`¿Eliminar la carpeta "${carpeta}" y todos los archivos contenidos?`)) {
        carpetasCreadas = carpetasCreadas.filter(c => c !== carpeta);
        delete carpetasEstado[carpeta];
        localStorage.setItem('py_carpetas', JSON.stringify(carpetasCreadas));
        localStorage.setItem('py_carpetas_estado', JSON.stringify(carpetasEstado));

        for (let ruta in sistemaArchivos) {
          if (ruta.startsWith(carpeta + '/')) {
            delete sistemaArchivos[ruta];
            pestanasAbiertas = pestanasAbiertas.filter(p => p !== ruta);
          }
        }

        if (Object.keys(sistemaArchivos).length === 0) {
          sistemaArchivos["main.py"] = "# Archivo principal\nprint('Hola Mundo')";
          pestanasAbiertas = ["main.py"];
          archivoActual = "main.py";
        } else if (!sistemaArchivos[archivoActual]) {
          archivoActual = Object.keys(sistemaArchivos)[0];
          if (!pestanasAbiertas.includes(archivoActual)) pestanasAbiertas.push(archivoActual);
        }

        localStorage.setItem('py_archivos', JSON.stringify(sistemaArchivos));
        cambiarPestana(archivoActual);
        renderizarArchivos();
      }
    }

    // --- BUSCADOR ---
    const buscadorInput = document.getElementById('buscadorInput');
    const badgeCoincidencias = document.getElementById('badgeCoincidencias');
    let listaMarcadores = [];
    let coincidencias = [];
    let indiceActual = -1;
    let queryPrevio = "";

    function limpiarMarcadores() {
      listaMarcadores.forEach(m => m.clear());
      listaMarcadores = [];
      coincidencias = [];
      indiceActual = -1;
      badgeCoincidencias.style.display = 'none';
    }

    function actualizarBusqueda(avanzar = true) {
      const query = buscadorInput.value;
      if (!query) {
        limpiarMarcadores();
        queryPrevio = "";
        return;
      }

      if (query !== queryPrevio) {
        limpiarMarcadores();
        queryPrevio = query;

        let cursor = editor.getSearchCursor(query, {line: 0, ch: 0}, {caseFold: true});
        while (cursor.findNext()) {
          coincidencias.push({from: cursor.from(), to: cursor.to()});
          listaMarcadores.push(editor.markText(cursor.from(), cursor.to(), {className: "cm-searching"}));
        }

        indiceActual = coincidencias.length > 0 ? 0 : -1;
      } else if (avanzar && coincidencias.length > 0) {
        indiceActual = (indiceActual + 1) % coincidencias.length;
      }

      if (coincidencias.length > 0) {
        badgeCoincidencias.style.display = 'inline-block';
        badgeCoincidencias.textContent = `[${indiceActual + 1}/${coincidencias.length}]`;
        const match = coincidencias[indiceActual];
        editor.setSelection(match.from, match.to);
        editor.scrollIntoView({from: match.from, to: match.to}, 100);
      } else {
        badgeCoincidencias.style.display = 'inline-block';
        badgeCoincidencias.textContent = `0/0`;
      }
    }

    buscadorInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        actualizarBusqueda(true);
      }
    });

    buscadorInput.addEventListener('input', () => actualizarBusqueda(false));

    // Terminal
    function toggleConsola() {
      const seccion = document.getElementById('seccionConsola');
      const flecha = document.getElementById('flechaConsola');
      seccion.classList.toggle('oculta');
      flecha.textContent = seccion.classList.contains('oculta') ? '🔼' : '🔽';

    function ejecutarCodigo() {
      const seccion = document.getElementById('seccionConsola');
      if (seccion.classList.contains('oculta')) {
        seccion.classList.remove('oculta');
        document.getElementById('flechaConsola').textContent = '🔽';
        setTimeout(() => editor.refresh(), 260);
      }

      salidaConsola.innerHTML = "";
      let codigo = editor.getValue();

      Sk.configure({
        output: (t) => {
          salidaConsola.appendChild(document.createTextNode(t));
          salidaConsola.scrollTop = salidaConsola.scrollHeight;
        },
        read: (x) => {
          if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) throw "Archivo no encontrado: '" + x + "'";
          return Sk.builtinFiles["files"][x];
        },
        inputfunTakesPrompt: true,
        inputfun: (promptText) => {
          return new Promise((resolve) => {
            salidaConsola.appendChild(document.createTextNode(promptText));
            let input = document.createElement("input");
            input.type = "text";
            input.className = "terminal-input";
            input.setAttribute("autocomplete", "off");
            salidaConsola.appendChild(input);
            input.focus();
            salidaConsola.scrollTop = salidaConsola.scrollHeight;

            input.addEventListener("keydown", (e) => {
              if (e.key === "Enter") {
                let val = input.value;
                input.remove();
                salidaConsola.appendChild(document.createTextNode(val + "\n"));
                resolve(val);
              }
            });
          });
        }
      });

      Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, codigo, true))
        .catch((err) => {
          let errSpan = document.createElement("span");
          errSpan.style.color = "#FF5198";
          errSpan.textContent = "\n[Error] " + err.toString() + "\n";
          salidaConsola.appendChild(errSpan);
          salidaConsola.scrollTop = salidaConsola.scrollHeight;
        });
    }

    bindAccion('btnCerrarModalPestana', () => document.getElementById('modalAbrirPestana').classList.remove('activo'));
    bindAccion('btnConfirmarAbrirPestana', confirmarAbrirPestana);
    bindAccion('btnEjecutar', ejecutarCodigo);
    bindAccion('flechaConsola', toggleConsola);
    bindAccion('btnLimpiarConsola', () => salidaConsola.innerHTML = "");
    bindAccion('estadoMotor', abrirModalDiagnostico);
    bindAccion('estadoInferior', abrirModalDiagnostico);
    bindAccion('btnCerrarModal', () => document.getElementById('modalListo').classList.remove('activo'));
    bindAccion('btnReiniciarMotor', () => {
      salidaConsola.innerHTML = "Motor Python reiniciado.\n";
      document.getElementById('modalListo').classList.remove('activo');
    });

    // Eventos Menú Contextual
    bindAccion('btnCtxCompartir', ejecutarCompartirContextual);
    bindAccion('btnCtxDescargar', ejecutarDescargarContextual);
    bindAccion('btnCtxEliminar', ejecutarEliminarContextual);

    renderizarPestanas();
  </script>
</body>
</html>
