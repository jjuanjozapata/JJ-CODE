<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Python Móvil - Prettier Theme</title>
  
  <link rel="icon" type="image/png" href="icono.png">
  <link rel="apple-touch-icon" href="icono.png">
  <link rel="manifest" href="manifest.json">
  
  <!-- CodeMirror -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">
  
  <!-- Skulpt -->
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/anyword-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      position: fixed;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #111B21;
      color: #E0E2E4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    .top-toolbar {
      flex-shrink: 0;
      background-color: #16242D;
      display: flex;
      align-items: center;
      padding: 10px 14px;
      gap: 12px;
      border-bottom: 1px solid #1A2B34;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #5C7482;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .icon-btn:active { color: #FF5198; }

    .search-pill {
      background-color: #1A2B34;
      border-radius: 20px;
      display: flex;
      align-items: center;
      padding: 6px 12px;
      flex: 1;
      gap: 6px;
      color: #5C7482;
    }

    .search-pill input {
      background: transparent;
      border: none;
      outline: none;
      color: #E0E2E4;
      width: 100%;
      font-size: 13px;
      pointer-events: none;
    }

    .btn-ejecutar-play {
      background-color: #FF5198;
      color: white;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(255, 81, 152, 0.4);
    }
    .btn-ejecutar-play:active { transform: scale(0.92); background-color: #E03E7E; }

    .tab-bar {
      flex-shrink: 0;
      background-color: #111B21;
      display: flex;
      border-bottom: 1px solid #1A2B34;
    }

    .tab {
      background-color: #1A2B34;
      color: #3CA9E2;
      padding: 8px 16px;
      font-family: monospace;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 2px solid #FF5198;
    }

    .editor-container {
      flex: 1;
      position: relative;
      background-color: #1A2B34;
      overflow: hidden;
    }

    .CodeMirror {
      height: 100% !important;
      position: absolute !important;
      top: 0; bottom: 0; left: 0; right: 0;
      font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
    }

    /* Prettier Theme */
    .cm-s-prettier.CodeMirror { background: #1A2B34; color: #E0E2E4; }
    .cm-s-prettier .CodeMirror-gutters { background: #1A2B34; border-right: 1px solid #233642; }
    .cm-s-prettier .CodeMirror-linenumber { color: #5C7482; }
    .cm-s-prettier .CodeMirror-cursor { border-left: 2px solid #FF5198; }
    .cm-s-prettier span.cm-keyword { color: #FF5198; font-weight: bold; }
    .cm-s-prettier span.cm-string { color: #28C0A9; }
    .cm-s-prettier span.cm-number { color: #E09873; }
    .cm-s-prettier span.cm-def { color: #3CA9E2; }
    .cm-s-prettier span.cm-variable { color: #E0E2E4; }
    .cm-s-prettier span.cm-variable-2 { color: #33CCFF; }
    .cm-s-prettier span.cm-comment { color: #697A85; font-style: italic; }
    .cm-s-prettier span.cm-operator { color: #FF5198; }
    .cm-s-prettier span.cm-builtin { color: #3CA9E2; }

    .console-section {
      flex-shrink: 0;
      height: 48%;
      background-color: #0B1216;
      border-top: 1px solid #233642;
      display: flex;
      flex-direction: column;
      transition: height 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .console-section.oculta { height: 38px; }

    .console-header {
      flex-shrink: 0;
      height: 38px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      font-size: 12px;
      color: #5C7482;
      border-bottom: 1px solid #111B21;
      user-select: none;
    }

    .console-body {
      flex: 1;
      padding: 10px 14px;
      font-family: 'SF Mono', Menlo, monospace;
      font-size: 13px;
      color: #E0E2E4;
      overflow-y: auto;
      white-space: pre-wrap;
      -webkit-overflow-scrolling: touch;
      cursor: text;
    }

    .bottom-bar {
      flex-shrink: 0;
      height: 28px;
      background-color: #111B21;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #3CA9E2;
      font-family: monospace;
      border-top: 1px solid #1A2B34;
    }

    .terminal-input {
      background: transparent;
      border: none;
      outline: none;
      color: #28C0A9;
      font-family: monospace;
      font-size: 13px;
      width: 140px;
      margin-left: 2px;
    }

    /* --- PANEL LATERAL FIJO ROBUSTO --- */
    .sidebar-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      z-index: 9998;
      display: none;
      backdrop-filter: blur(2px);
    }
    .sidebar-overlay.activo { display: block; }

    .sidebar {
      position: fixed;
      top: 0; left: -300px; width: 290px; height: 100vh;
      background-color: #111B21;
      border-right: 1px solid #1A2B34;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease-out;
      transform: translateX(0);
    }
    .sidebar.abierto { transform: translateX(300px); }

    .sidebar-header {
      padding: 16px 14px;
      font-size: 13px;
      font-weight: bold;
      color: #8198a5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1A2B34;
      background-color: #16242D;
    }

    .sidebar-actions {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      background-color: #111B21;
      border-bottom: 1px solid #1A2B34;
    }

    .sidebar-btn {
      flex: 1;
      background: #1A2B34;
      color: #E0E2E4;
      border: 1px solid #233642;
      padding: 8px 6px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
      text-align: center;
    }
    .sidebar-btn:active { background: #FF5198; color: white; }

    .file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .tree-folder {
      font-size: 13px;
      color: #FF5198;
      font-weight: bold;
      padding: 8px 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #16242D;
      margin-top: 6px;
    }

    .tree-file {
      font-size: 13px;
      color: #E0E2E4;
      padding: 10px 12px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      margin: 3px 0;
      background: #16242D;
    }
    .tree-file:active { background-color: #233642; }

    .tree-file.activo {
      background-color: #1A2B34;
      color: #3CA9E2;
      border-left: 3px solid #FF5198;
    }

    .tree-file-sub {
      margin-left: 14px;
      background: #131E25;
    }

    .btn-delete-file {
      color: #5C7482;
      font-size: 14px;
      padding: 4px 8px;
    }
    .btn-delete-file:active { color: #ef4444; }
  </style>
</head>
<body>

  <!-- Overlay -->
  <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

  <!-- Menú lateral -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span>EXPLORADOR DE ARCHIVOS</span>
      <span style="cursor: pointer; font-size: 16px; padding: 4px;" onclick="toggleSidebar()">✕</span>
    </div>
    <div class="sidebar-actions">
      <button class="sidebar-btn" onclick="crearArchivoPrompt()">📄 + Archivo</button>
      <button class="sidebar-btn" onclick="crearCarpetaPrompt()">📁 + Carpeta</button>
    </div>
    <div class="file-tree" id="listaArchivos"></div>
  </aside>

  <div class="app-wrapper">
    <header class="top-toolbar">
      <!-- Botón de carpeta con evento forzado -->
      <button class="icon-btn" id="btnCarpeta" onclick="toggleSidebar()" title="Ver Archivos">📁</button>
      <button class="icon-btn">🔀</button>
      <div class="search-pill">
        <span>🔍</span>
        <input type="text" id="nombreEnBuscador" value="prueba.py">
      </div>
      <button class="btn-ejecutar-play" onclick="ejecutarCodigo()" title="Ejecutar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="icon-btn">•••</button>
    </header>

    <div class="tab-bar">
      <div class="tab" id="pestanaArchivo">&lt;/&gt; prueba.py</div>
    </div>

    <div class="editor-container">
      <textarea id="codigo"></textarea>
    </div>

    <section class="console-section" id="seccionConsola">
      <div class="console-header">
        <span style="font-weight: bold; color: #8198a5;">🖥 Consola</span>
        <div style="display: flex; gap: 14px; align-items: center;">
          <span id="estadoMotor" style="color: #28C0A9; font-size: 11px;">Listo</span>
          <span style="cursor: pointer; font-size: 14px;" onclick="limpiarConsola()" title="Limpiar">🗑</span>
          <span style="cursor: pointer; font-size: 14px; padding: 4px;" onclick="toggleConsola()" id="flechaConsola" title="Ocultar / Mostrar">🔽</span>
        </div>
      </div>
      
      <div class="console-body" id="salidaConsola" onclick="enfocarInput()"></div>
      
      <div class="bottom-bar">
        <span id="posicionCursor">&lt;/&gt; Python Lín 1, Col 1</span>
      </div>
    </section>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(() => console.log('¡Modo offline listo!'));
    }

    // Memoria local
    let sistemaArchivos = JSON.parse(localStorage.getItem('py_archivos')) || {
      "prueba.py": "nombre = input('Ingresa tu nombre: ')\nprint(f'Hola {nombre}, tus archivos se guardan automáticamente.')"
    };
    let carpetasCreadas = JSON.parse(localStorage.getItem('py_carpetas')) || [];
    let archivoActual = localStorage.getItem('py_archivo_activo') || 'prueba.py';

    if (!sistemaArchivos[archivoActual]) {
      archivoActual = Object.keys(sistemaArchivos)[0] || 'prueba.py';
      if (!sistemaArchivos[archivoActual]) sistemaArchivos['prueba.py'] = '# Empieza a escribir';
    }

    const salidaConsola = document.getElementById("salidaConsola");
    
    const editor = CodeMirror.fromTextArea(document.getElementById("codigo"), {
      mode: "python", 
      theme: "prettier", 
      lineNumbers: true, 
      lineWrapping: true, 
      autoCloseBrackets: true,
      inputStyle: "contenteditable",
      extraKeys: {"Ctrl-Space": "autocomplete"}
    });

    editor.setValue(sistemaArchivos[archivoActual]);
    actualizarVistasEncabezado();

    editor.on("change", () => {
      sistemaArchivos[archivoActual] = editor.getValue();
      localStorage.setItem('py_archivos', JSON.stringify(sistemaArchivos));
    });

    editor.on("inputRead", function(cm, change) {
      if (change.text[0].match(/[a-zA-Z_]/)) { cm.showHint({completeSingle: false}); }
    });

    editor.on("cursorActivity", () => {
      const pos = editor.getCursor();
      document.getElementById("posicionCursor").textContent = `</> Python Lín ${pos.line + 1}, Col ${pos.ch + 1}`;
    });

    // Control del menú lateral
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      const estaAbierto = sidebar.classList.toggle('abierto');
      overlay.classList.toggle('activo', estaAbierto);
      if (estaAbierto) renderizarArchivos();
    }

    function renderizarArchivos() {
      const contenedor = document.getElementById('listaArchivos');
      contenedor.innerHTML = '';

      carpetasCreadas.forEach(carpeta => {
        const itemCarpeta = document.createElement('div');
        itemCarpeta.className = 'tree-folder';
        itemCarpeta.innerHTML = `📁 ${carpeta}`;
        contenedor.appendChild(itemCarpeta);
      });

      for (const ruta in sistemaArchivos) {
        const item = document.createElement('div');
        const esSub = ruta.includes('/');
        item.className = `tree-file ${esSub ? 'tree-file-sub' : ''} ${ruta === archivoActual ? 'activo' : ''}`;
        
        item.innerHTML = `
          <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" onclick="abrirArchivo('${ruta}')">
            📄 ${ruta}
          </span>
          <span class="btn-delete-file" onclick="event.stopPropagation(); eliminarArchivo('${ruta}')">🗑</span>
        `;
        contenedor.appendChild(item);
      }
    }

    function abrirArchivo(ruta) {
      archivoActual = ruta;
      localStorage.setItem('py_archivo_activo', ruta);
      editor.setValue(sistemaArchivos[ruta]);
      actualizarVistasEncabezado();
      toggleSidebar();
    }

    function actualizarVistasEncabezado() {
      document.getElementById('pestanaArchivo').textContent = `</> ${archivoActual}`;
      document.getElementById('nombreEnBuscador').value = archivoActual;
    }

    function crearArchivoPrompt() {
      let nombre = prompt("Nombre del archivo (ej: script.py o carpeta/script.py):");
      if (!nombre) return;
      if (!nombre.endsWith('.py')) nombre += '.py';

      if (sistemaArchivos[nombre]) {
        alert("Ya existe un archivo con ese nombre.");
        return;
      }

      sistemaArchivos[nombre] = "# Nuevo script Python\n";
      localStorage.setItem('py_archivos', JSON.stringify(sistemaArchivos));
      abrirArchivo(nombre);
    }

    function crearCarpetaPrompt() {
      const nombre = prompt("Nombre de la nueva carpeta:");
      if (!nombre) return;
      if (!carpetasCreadas.includes(nombre)) {
        carpetasCreadas.push(nombre);
        localStorage.setItem('py_carpetas', JSON.stringify(carpetasCreadas));
        renderizarArchivos();
      }
    }

    function eliminarArchivo(ruta) {
      const total = Object.keys(sistemaArchivos).length;
      if (total <= 1) {
        alert("Debes tener al menos un archivo.");
        return;
      }

      if (confirm(`¿Seguro que deseas eliminar ${ruta}?`)) {
        delete sistemaArchivos[ruta];
        localStorage.setItem('py_archivos', JSON.stringify(sistemaArchivos));
        if (archivoActual === ruta) {
          archivoActual = Object.keys(sistemaArchivos)[0];
          abrirArchivo(archivoActual);
        } else {
          renderizarArchivos();
        }
      }
    }

    // Terminal
    function enfocarInput() {
      const inputTerminal = document.querySelector('.terminal-input');
      if (inputTerminal) inputTerminal.focus();
    }

    function toggleConsola() {
      const seccion = document.getElementById('seccionConsola');
      const flecha = document.getElementById('flechaConsola');
      seccion.classList.toggle('oculta');
      flecha.textContent = seccion.classList.contains('oculta') ? '🔼' : '🔽';
      setTimeout(() => editor.refresh(), 260);
    }

    function limpiarConsola() {
      salidaConsola.innerHTML = "";
    }

    function leerArchivo(archivo) {
      if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][archivo] === undefined) {
        throw "Archivo no encontrado: '" + archivo + "'";
      }
      return Sk.builtinFiles["files"][archivo];
    }

    function ejecutarCodigo() {
      const seccion = document.getElementById('seccionConsola');
      const flecha = document.getElementById('flechaConsola');
      
      if (seccion.classList.contains('oculta')) {
        seccion.classList.remove('oculta');
        flecha.textContent = '🔽';
        setTimeout(() => editor.refresh(), 260);
      }

      salidaConsola.innerHTML = "";
      let codigo = editor.getValue();

      Sk.configure({
        output: function(texto) {
          salidaConsola.appendChild(document.createTextNode(texto));
          salidaConsola.scrollTop = salidaConsola.scrollHeight;
        },
        read: leerArchivo,
        inputfunTakesPrompt: true,
        inputfun: function(promptText) {
          return new Promise((resolve) => {
            salidaConsola.appendChild(document.createTextNode(promptText));
            
            let campoInput = document.createElement("input");
            campoInput.type = "text";
            campoInput.className = "terminal-input";
            campoInput.setAttribute("autocomplete", "off");
            campoInput.setAttribute("autocorrect", "off");
            campoInput.setAttribute("autocapitalize", "off");
            campoInput.setAttribute("spellcheck", "false");
            
            salidaConsola.appendChild(campoInput);
            campoInput.focus();
            salidaConsola.scrollTop = salidaConsola.scrollHeight;

            campoInput.addEventListener("keydown", function(e) {
              if (e.key === "Enter") {
                let valor = campoInput.value;
                campoInput.remove();
                salidaConsola.appendChild(document.createTextNode(valor + "\n"));
                resolve(valor);
              }
            });
          });
        }
      });

      Sk.misceval.asyncToPromise(function() {
        return Sk.importMainWithBody("<stdin>", false, codigo, true);
      }).catch(function(err) {
        let errorSpan = document.createElement("span");
        errorSpan.style.color = "#FF5198";
        errorSpan.textContent = "\n[Error] " + err.toString() + "\n";
        salidaConsola.appendChild(errorSpan);
        salidaConsola.scrollTop = salidaConsola.scrollHeight;
      });
    }
  </script>
</body>
</html>
