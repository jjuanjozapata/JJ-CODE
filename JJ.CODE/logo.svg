<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo azul medianoche con bordes redondeados -->
  <rect width="512" height="512" rx="115" fill="#111B21"/>
  
  <!-- Borde sutil neón -->
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#28C0A9" stroke-width="6" opacity="0.4"/>
  
  <!-- Símbolo de terminal > en rosa eléctrico -->
  <path d="M 120 150 L 250 256 L 120 362" fill="none" stroke="#FF5198" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Cursor _ en verde agua -->
  <line x1="280" y1="362" x2="390" y2="362" stroke="#28C0A9" stroke-width="46" stroke-linecap="round"/>
  
  <!-- Pequeño destello Python en azul -->
  <circle cx="390" cy="160" r="22" fill="#3CA9E2"/>
</svg>
