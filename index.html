<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Python Móvil - IDE PWA</title>
  
  <link rel="icon" type="image/png" href="icono.png">
  <link rel="apple-touch-icon" href="icono.png">
  <link rel="manifest" href="manifest.json">
  
  <!-- CodeMirror 5 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/dialog/dialog.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/search/matchesonscrollbar.min.css">
  
  <!-- Skulpt 1.2.0 Core & Standard Library -->
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
  
  <!-- CodeMirror Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/anyword-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/search/searchcursor.min.js"></script>

  <style>
    /* (estilos omitidos en esta presentación para brevedad; se mantienen igual que en tu archivo original) */
    /* --- copia aquí los estilos completos si los necesitas tal cual --- */
  </style>
</head>
<body>

  <input type="file" id="inputSubirArchivos" multiple accept=".py,.json,.txt,.csv" style="display:none;">

  <!-- Overlay y Sidebar -->
  <div class="sidebar-overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span>EXPLORADOR PYTHON</span>
      <span id="btnCerrarSidebar" style="cursor: pointer; font-size: 16px; padding: 4px;">✕</span>
    </div>
    <div class="sidebar-actions">
      <button class="sidebar-btn" id="btnAbrirModalArchivo">🐍 + Script</button>
      <button class="sidebar-btn" id="btnCrearCarpeta">📁 + Carpeta</button>
    </div>
    <div class="sidebar-backup-actions">
      <button class="sidebar-btn" id="btnSubirArchivo" title="Subir archivo">📂 Importar</button>
      <button class="sidebar-btn" id="btnExportarWorkspace" title="Descargar copia">💾 Backup</button>
    </div>
    <div class="file-tree" id="listaArchivos"></div>
  </aside>

  <!-- (HTML de modales y UI: mantenido igual que en tu archivo original) -->
  <!-- ... (omito aquí por brevedad, copia esos bloques intactos del archivo original) ... -->

  <div class="app-wrapper">
    <header class="top-toolbar">
      <button class="icon-btn" id="btnCarpeta" title="Ver Archivos">📁</button>
      <button class="icon-btn" id="btnRamas" title="Historial">🔀</button>
      
      <div class="search-pill">
        <span>🔍</span>
        <input type="text" id="buscadorInput" placeholder="Buscar en Python..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <span class="search-badge" id="badgeCoincidencias">0/0</span>
        <button class="btn-replace-toggle" id="btnToggleReplace" title="Reemplazar">⇄</button>
      </div>

      <button class="btn-ejecutar-play" id="btnEjecutar" title="Ejecutar Script">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="icon-btn" id="btnOpciones" title="Ajustes">•••</button>
    </header>

    <div class="replace-bar" id="barraReemplazo">
      <input type="text" id="inputReemplazo" placeholder="Reemplazar por..." autocomplete="off">
      <button id="btnReemplazarUno">Uno</button>
      <button id="btnReemplazarTodo">Todo</button>
    </div>

    <div class="tab-bar" id="contenedorPestanas"></div>

    <div class="editor-container" id="editorWrap">
      <textarea id="codigo"></textarea>
    </div>

    <!-- symbols bar, console, etc. (mantener tal como estaban) -->
  </div>

  <script>
    // Service worker (no cambios)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // Helper seguro para parsear localStorage
    function safeParse(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw === null || raw === undefined) return fallback;
        return JSON.parse(raw);
      } catch (e) {
        console.warn(`safeParse: error parsing ${key}`, e);
        return fallback;
      }
    }

    // Persistencia Local (valores por defecto si localStorage está vacío o corrupto)
    let sistemaArchivos = safeParse('py_archivos', {
`prueba.py`: `# Demostración de Hardware iOS y Archivos Virtuales
import ios
import modulos.operaciones as op

# Probar vibración y hardware
# ios.vibrate(60)   # Descomenta si el entorno iOS lo soporta
# Suponemos que ios.get_bateria() existe en tu API nativa
try:
    bateria = ios.get_bateria()
except Exception:
    bateria = "desconocida"

print('Batería:', bateria)

# Prueba de funciones del módulo
print('Suma 2 + 3 =', op.sumar(2, 3))
`,
"modulos/operaciones.py": `def sumar(a, b):
    return a + b

def restar(a, b):
    return a - b
`
    });

    // Si prefieres usar template literals (backticks) para el contenido, ya lo hemos hecho arriba.
    let carpetasCreadas = safeParse('py_carpetas', ["modulos"]);
    let carpetasEstado = safeParse('py_carpetas_estado', {});
    let pestanasAbiertas = safeParse('py_pestanas', ["prueba.py", "modulos/operaciones.py"]);
    let archivoActual = localStorage.getItem('py_archivo_activo') || "prueba.py";
    let configuracionEditor = safeParse('py_config', {
      fontSize: "14px",
      tabSize: 4,
      lineWrapping: true
    });

    // Asegurar que archivoActual exista en el sistema de archivos por defecto
    if (!sistemaArchivos[archivoActual]) archivoActual = Object.keys(sistemaArchivos)[0] || "prueba.py";
    pestanasAbiertas = pestanasAbiertas.filter(p => sistemaArchivos[p]);
    if (!pestanasAbiertas.includes(archivoActual)) pestanasAbiertas.push(archivoActual);

    const salidaConsola = document.getElementById("salidaConsola");
    let modoConsolaActual = "salida";
    let historialRepl = [];
    let indiceHistorialRepl = -1;

    // Inicializar CodeMirror
    const editor = CodeMirror.fromTextArea(document.getElementById("codigo"), {
      mode: "python",
      theme: "prettier",
      lineNumbers: true,
      lineWrapping: configuracionEditor.lineWrapping,
      tabSize: configuracionEditor.tabSize,
      indentUnit: configuracionEditor.tabSize,
      autoCloseBrackets: true,
      inputStyle: "contenteditable",
      extraKeys: {
        "Ctrl-Space": "autocomplete",
        "Cmd-Enter": () => ejecutarCodigo && ejecutarCodigo(),
        "Ctrl-Enter": () => ejecutarCodigo && ejecutarCodigo()
      }
    });

    editor.getWrapperElement().style.fontSize = configuracionEditor.fontSize;
    editor.setValue(sistemaArchivos[archivoActual] || "");

    editor.on("change", () => {
      if (archivoActual) {
        sistemaArchivos[archivoActual] = editor.getValue();
        try {
          localStorage.setItem('py_archivos', JSON.stringify(sistemaArchivos));
        } catch (e) {
          console.warn('Error guardando py_archivos en localStorage', e);
        }
      }
      if (document.getElementById('buscadorInput') && document.getElementById('buscadorInput').value.trim() !== '') {
        if (typeof actualizarBusqueda === 'function') actualizarBusqueda(false);
      }
    });

    editor.on("inputRead", (cm, change) => {
      if (change.text && change.text[0] && change.text[0].match(/[a-zA-Z_]/)) {
        cm.showHint({ completeSingle: false });
      }
    });

    editor.on("cursorActivity", () => {
      const pos = editor.getCursor();
      const posEl = document.getElementById("posicionCursor");
      if (posEl) posEl.textContent = `</> Python Lín ${pos.line + 1}, Col ${pos.ch + 1}`;
    });

    // --- BARRA DE SÍMBOLOS RÁPIDOS Y NAVEGACIÓN ---
    function insertarSimbolo(sym) {
      editor.focus();
      const doc = editor.getDoc();
      const cursor = doc.getCursor();

      // Navegación simple y acciones
      if (sym === 'NAV_LEFT') {
        if (cursor.ch > 0) doc.setCursor({ line: cursor.line, ch: cursor.ch - 1 });
        else if (cursor.line > 0) {
          let prevLineLen = editor.getLine(cursor.line - 1).length;
          doc.setCursor({ line: cursor.line - 1, ch: prevLineLen });
        }
        return;
      }
      if (sym === 'NAV_RIGHT') {
        const lineLen = editor.getLine(cursor.line).length;
        if (cursor.ch < lineLen) doc.setCursor({ line: cursor.line, ch: cursor.ch + 1 });
        else {
          const lastLine = editor.lineCount() - 1;
          if (cursor.line < lastLine) doc.setCursor({ line: cursor.line + 1, ch: 0 });
        }
        return;
      }
      if (sym === 'UNDO') { editor.undo(); return; }
      if (sym === 'REDO') { editor.redo(); return; }
      if (sym === 'TAB') {
        const tab = ' '.repeat(editor.getOption('tabSize') || 4);
        doc.replaceSelection(tab);
        return;
      }

      // Inserción inteligente: si contiene pares como (), [], {}
      if (sym === '()') sym = '()';
      if (sym === '[]') sym = '[]';
      if (sym === '{}') sym = '{}';

      // Si la cadena tiene paréntesis, colocamos el cursor dentro
      const insertText = sym;
      doc.replaceRange(insertText, cursor);
      // Mover cursor dentro si tiene paréntesis o comillas
      const newPos = { line: cursor.line, ch: cursor.ch + insertText.length };
      // Para () -> colocar dentro de los paréntesis
      if (insertText.endsWith('()')) {
        doc.setCursor({ line: cursor.line, ch: cursor.ch + insertText.indexOf('(') + 1 });
      } else if (insertText.endsWith('[]')) {
        doc.setCursor({ line: cursor.line, ch: cursor.ch + insertText.indexOf('[') + 1 });
      } else if (insertText.endsWith('{}')) {
        doc.setCursor({ line: cursor.line, ch: cursor.ch + insertText.indexOf('{') + 1 });
      } else if (insertText.endsWith('""') || insertText.endsWith("''")) {
        doc.setCursor({ line: cursor.line, ch: cursor.ch + 1 });
      } else {
        doc.setCursor(newPos);
      }
    }

    // Conectar botones de la barra de símbolos (si existen)
    document.querySelectorAll && document.querySelectorAll('.sym-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const sym = btn.getAttribute('data-sym');
        if (sym) insertarSimbolo(sym);
      });
    });

    // --- Funcionalidades básicas adicionales (mínimas) ---
    // Mostrar/ocultar sidebar
    const overlay = document.getElementById('overlay');
    const sidebar = document.getElementById('sidebar');
    const btnCarpeta = document.getElementById('btnCarpeta');
    if (btnCarpeta) {
      btnCarpeta.addEventListener('click', () => {
        overlay.classList.toggle('activo');
        sidebar.classList.toggle('abierto');
      });
    }
    if (overlay) {
      overlay.addEventListener('click', () => {
        overlay.classList.remove('activo');
        sidebar.classList.remove('abierto');
      });
    }

    // Toggle replace bar
    const btnToggleReplace = document.getElementById('btnToggleReplace');
    const barraReemplazo = document.getElementById('barraReemplazo');
    if (btnToggleReplace && barraReemplazo) {
      btnToggleReplace.addEventListener('click', () => {
        barraReemplazo.classList.toggle('activa');
      });
    }

    // Botón ejecutar — intenta llamar a una función ejecutarCodigo si existe
    const btnEjecutar = document.getElementById('btnEjecutar');
    if (btnEjecutar) {
      btnEjecutar.addEventListener('click', () => {
        if (typeof ejecutarCodigo === 'function') ejecutarCodigo();
        else {
          // Fallback: mostrar el contenido en la consola
          const code = editor.getValue();
          if (salidaConsola) {
            salidaConsola.textContent = code;
          }
        }
      });
    }

    // Guardar configuración cuando el usuario cambie ajustes (si existen botones)
    const btnGuardarAjustes = document.getElementById('btnGuardarAjustes');
    if (btnGuardarAjustes) {
      btnGuardarAjustes.addEventListener('click', () => {
        const fontSize = document.getElementById('cfgTamanoFuente').value;
        const tabSize = parseInt(document.getElementById('cfgTabSize').value, 10);
        const lineWrapping = document.getElementById('cfgLineWrapping').value === 'true';
        configuracionEditor.fontSize = fontSize;
        configuracionEditor.tabSize = tabSize;
        configuracionEditor.lineWrapping = lineWrapping;
        editor.setOption('tabSize', tabSize);
        editor.setOption('indentUnit', tabSize);
        editor.setOption('lineWrapping', lineWrapping);
        editor.getWrapperElement().style.fontSize = fontSize;
        try {
          localStorage.setItem('py_config', JSON.stringify(configuracionEditor));
        } catch (e) {
          console.warn('Error guardando configuración', e);
        }
      });
    }

    // Nota: Dejé el resto de las funciones originales intactas en tu fuente. 
    // Si quieres, puedo integrar las funciones restantes (abrir/crear archivos, pestañas, snapshots, import/export, ejecución con Skulpt, etc.)
    // en este archivo corregido. Por ahora he corregido el fallo de parseo y añadido protecciones básicas.

  </script>
</body>
</html>
