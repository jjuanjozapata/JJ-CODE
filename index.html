<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Python 3 Móvil - IDE PWA</title>
  
  <link rel="icon" type="image/png" href="icono.png">
  <link rel="apple-touch-icon" href="icono.png">
  <link rel="manifest" href="manifest.json">
  
  <!-- CodeMirror 5 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  
  <!-- Pyodide (Python 3 Oficial sobre WebAssembly) -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
  
  <!-- CodeMirror Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>

  <style>
    :root {
      --bg-dark: #0f111a;
      --bg-surface: #1a1c23;
      --bg-toolbar: #1e222d;
      --border-color: #2b3040;
      --text-main: #e0e6ed;
      --text-muted: #8a919e;
      --accent-color: #00e676;
      --danger-color: #ff5370;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      height: 100dvh;
      overflow: hidden;
      display: flex;
    }

    .app-wrapper {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    .top-toolbar {
      display: flex;
      align-items: center;
      background: var(--bg-toolbar);
      padding: 6px 12px;
      gap: 10px;
      border-bottom: 1px solid var(--border-color);
      height: 48px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .search-pill {
      display: flex;
      align-items: center;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 3px 10px;
      flex: 1;
      height: 32px;
      gap: 6px;
    }

    .search-pill input {
      background: none;
      border: none;
      color: var(--text-main);
      width: 100%;
      font-size: 13px;
      outline: none;
    }

    .btn-ejecutar-play {
      background: var(--accent-color);
      color: #000;
      border: none;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .tab-bar {
      display: flex;
      background: var(--bg-dark);
      overflow-x: auto;
      border-bottom: 1px solid var(--border-color);
      scrollbar-width: none;
      height: 36px;
    }
    .tab-bar::-webkit-scrollbar { display: none; }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-item.activa {
      background: var(--bg-dark);
      color: var(--accent-color);
      border-bottom: 2px solid var(--accent-color);
    }

    .tab-close {
      cursor: pointer;
      padding: 2px;
    }

    .editor-container {
      flex: 1;
      position: relative;
      background: var(--bg-dark);
    }

    .CodeMirror {
      height: 100% !important;
      font-family: Menlo, Monaco, Consolas, monospace !important;
      font-size: 14px;
      background: #0f111a !important;
      color: #e0e6ed !important;
    }

    .CodeMirror-gutters {
      background: #0f111a !important;
      border-right: 1px solid var(--border-color) !important;
    }

    .symbols-bar {
      display: flex;
      align-items: center;
      background: var(--bg-toolbar);
      overflow-x: auto;
      border-top: 1px solid var(--border-color);
      padding: 4px 6px;
      gap: 5px;
      scrollbar-width: none;
      height: 42px;
    }
    .symbols-bar::-webkit-scrollbar { display: none; }

    .sym-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 13px;
      font-family: monospace;
      cursor: pointer;
      white-space: nowrap;
    }

    .sym-btn:active {
      background: var(--accent-color);
      color: #000;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-dark);
      padding: 2px 12px;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      height: 22px;
    }

    .console-panel {
      height: 35%;
      background: #08090d;
      border-top: 2px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-surface);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      border-bottom: 1px solid var(--border-color);
    }

    .console-body {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      font-family: Menlo, monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      user-select: text;
    }

    .console-error { color: var(--danger-color); }

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 900;
      display: none;
    }
    .sidebar-overlay.activo { display: block; }

    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100dvh;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease;
    }
    .sidebar.abierto { transform: translateX(280px); }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      border-bottom: 1px solid var(--border-color);
      font-weight: bold;
    }

    .sidebar-actions {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-btn {
      flex: 1;
      background: var(--bg-toolbar);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .file-item {
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
    }
    .file-item.activo {
      background: var(--border-color);
      color: var(--accent-color);
    }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span>EXPLORADOR PYTHON</span>
      <span id="btnCerrarSidebar" style="cursor: pointer;">✕</span>
    </div>
    <div class="sidebar-actions">
      <button class="sidebar-btn" id="btnNuevoScript">🐍 + Script</button>
    </div>
    <div class="file-tree" id="listaArchivos"></div>
  </aside>

  <div class="app-wrapper">
    <header class="top-toolbar">
      <button class="icon-btn" id="btnCarpeta">📁</button>
      
      <div class="search-pill">
        <span>🔍</span>
        <input type="text" placeholder="Buscar..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>

      <button class="btn-ejecutar-play" id="btnEjecutar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </header>

    <div class="tab-bar" id="contenedorPestanas"></div>

    <div class="editor-container">
      <textarea id="codigo"></textarea>
    </div>

    <div class="symbols-bar">
      <button class="sym-btn" data-sym="NAV_LEFT">◀</button>
      <button class="sym-btn" data-sym="NAV_RIGHT">▶</button>
      <button class="sym-btn" data-sym="TAB">TAB</button>
      <button class="sym-btn" data-sym=":">:</button>
      <button class="sym-btn" data-sym="=">=</button>
      <button class="sym-btn" data-sym="()">()</button>
      <button class="sym-btn" data-sym="[]">[]</button>
      <button class="sym-btn" data-sym="{}">{}</button>
      <button class="sym-btn" data-sym="''">''</button>
      <button class="sym-btn" data-sym='""'>""</button>
      <button class="sym-btn" data-sym="def ">def</button>
      <button class="sym-btn" data-sym="return ">return</button>
      <button class="sym-btn" data-sym="print()">print()</button>
    </div>

    <div class="status-bar">
      <span id="posicionCursor">&lt;/&gt; Python Lín 1, Col 1</span>
      <span id="estadoEjecucion">Iniciando motor Python 3...</span>
    </div>

    <div class="console-panel">
      <div class="console-header">
        <span>CONSOLA</span>
        <button class="icon-btn" id="btnLimpiarConsola" style="font-size: 11px;">Limpiar</button>
      </div>
      <div class="console-body" id="salidaConsola"></div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    function safeParse(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return (raw !== null && raw !== undefined) ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    let sistemaArchivos = safeParse('py_archivos', {
      "prueba.py": `# Python 3 Estándar Completo con Soporte Unicode
import modulos.operaciones as op

def obtener_compañeros(cantidad_de_compañeros):
    compañeros = []
    for i in range(cantidad_de_compañeros):
        nombre = input("Ingrese el nombre del compañero: ")
        edad = int(input("Ingrese la edad del compañero: "))
        compañeros.append((nombre, edad))
    return compañeros

print("Suma módulo (5 + 3):", op.sumar(5, 3))

# Escritura de archivos locales nativa
with open('datos.txt', 'w', encoding='utf-8') as f:
    f.write('Guardado desde Python 3 estándar!')

print("Archivo datos.txt creado con éxito.")
`,
      "modulos/operaciones.py": `def sumar(a, b):
    return a + b

def restar(a, b):
    return a - b
`
    });

    let pestanasAbiertas = safeParse('py_pestanas', ["prueba.py", "modulos/operaciones.py"]);
    let archivoActual = localStorage.getItem('py_archivo_activo') || "prueba.py";

    if (!sistemaArchivos[archivoActual]) archivoActual = Object.keys(sistemaArchivos)[0] || "prueba.py";
    pestanasAbiertas = pestanasAbiertas.filter(p => sistemaArchivos[p]);
    if (!pestanasAbiertas.includes(archivoActual)) pestanasAbiertas.push(archivoActual);

    const salidaConsola = document.getElementById("salidaConsola");
    const estadoEjecucion = document.getElementById("estadoEjecucion");

    // Inicializar CodeMirror 5
    let editor = CodeMirror.fromTextArea(document.getElementById("codigo"), {
      mode: "python",
      lineNumbers: true,
      lineWrapping: true,
      tabSize: 4,
      indentUnit: 4,
      autoCloseBrackets: true,
      inputStyle: "contenteditable",
      autocorrect: false,
      autocapitalize: false,
      spellcheck: false
    });

    editor.setValue(sistemaArchivos[archivoActual] || "");

    editor.on("change", () => {
      if (archivoActual) {
        sistemaArchivos[archivoActual] = editor.getValue();
        localStorage.setItem('py_archivos', JSON.stringify(sistemaArchivos));
      }
    });

    editor.on("cursorActivity", () => {
      const pos = editor.getCursor();
      document.getElementById("posicionCursor").textContent = `</> Python Lín ${pos.line + 1}, Col ${pos.ch + 1}`;
    });

    function renderizarPestanas() {
      const contenedor = document.getElementById("contenedorPestanas");
      contenedor.innerHTML = "";
      pestanasAbiertas.forEach(archivo => {
        const tab = document.createElement("div");
        tab.className = `tab-item ${archivo === archivoActual ? "activa" : ""}`;
        tab.innerHTML = `<span>${archivo.split('/').pop()}</span><span class="tab-close">✕</span>`;
        tab.onclick = (e) => {
          if (e.target.classList.contains("tab-close")) {
            cerrarPestana(archivo);
          } else {
            abrirArchivo(archivo);
          }
        };
        contenedor.appendChild(tab);
      });
      localStorage.setItem('py_pestanas', JSON.stringify(pestanasAbiertas));
      localStorage.setItem('py_archivo_activo', archivoActual);
    }

    function renderizarArbolArchivos() {
      const lista = document.getElementById("listaArchivos");
      lista.innerHTML = "";
      Object.keys(sistemaArchivos).forEach(archivo => {
        const item = document.createElement("div");
        item.className = `file-item ${archivo === archivoActual ? "activo" : ""}`;
        item.textContent = archivo;
        item.onclick = () => {
          abrirArchivo(archivo);
          toggleSidebar(false);
        };
        lista.appendChild(item);
      });
    }

    function abrirArchivo(nombre) {
      if (sistemaArchivos[nombre] === undefined) return;
      archivoActual = nombre;
      if (!pestanasAbiertas.includes(nombre)) pestanasAbiertas.push(nombre);
      editor.setValue(sistemaArchivos[nombre]);
      renderizarPestanas();
      renderizarArbolArchivos();
    }

    function cerrarPestana(nombre) {
      pestanasAbiertas = pestanasAbiertas.filter(p => p !== nombre);
      if (archivoActual === nombre) {
        archivoActual = pestanasAbiertas[pestanasAbiertas.length - 1] || "";
        if (archivoActual) editor.setValue(sistemaArchivos[archivoActual]);
        else editor.setValue("");
      }
      renderizarPestanas();
    }

    // Inicialización del Motor Pyodide
    let pyodide = null;
    async function inicializarPyodide() {
      try {
        pyodide = await loadPyodide({
          stdout: (text) => {
            salidaConsola.textContent += text + "\n";
            salidaConsola.scrollTop = salidaConsola.scrollHeight;
          },
          stderr: (text) => {
            const span = document.createElement("span");
            span.className = "console-error";
            span.textContent = text + "\n";
            salidaConsola.appendChild(span);
          }
        });

        // Configuración de input() nativo mediante prompt
        pyodide.setStdin({
          stdin: () => prompt("Entrada de Python (input):") || ""
        });

        estadoEjecucion.textContent = "Python 3 Listo";
      } catch (err) {
        estadoEjecucion.textContent = "Error cargando motor";
        console.error(err);
      }
    }
    inicializarPyodide();

    // Sincronizar VFS con el sistema de archivos de Pyodide (MEMFS)
    function sincronizarVFS() {
      if (!pyodide) return;
      for (const ruta in sistemaArchivos) {
        const partes = ruta.split("/");
        if (partes.length > 1) {
          let dirAcumulado = "";
          for (let i = 0; i < partes.length - 1; i++) {
            dirAcumulado += (i === 0 ? "" : "/") + partes[i];
            try {
              pyodide.FS.mkdir(dirAcumulado);
            } catch (e) {} // Ignorar si el directorio ya existe
          }
        }
        pyodide.FS.writeFile(ruta, sistemaArchivos[ruta], { encoding: "utf8" });
      }
    }

    // Ejecución de Código Python 3
    async function ejecutarCodigo() {
      if (!pyodide) {
        alert("El motor Python 3 aún se está descargando/iniciando...");
        return;
      }

      salidaConsola.textContent = "";
      estadoEjecucion.textContent = "Ejecutando...";

      try {
        sincronizarVFS();
        const codigo = editor.getValue();
        await pyodide.runPythonAsync(codigo);
        estadoEjecucion.textContent = "Python 3 Listo";
      } catch (err) {
        estadoEjecucion.textContent = "Error de ejecución";
        const span = document.createElement("span");
        span.className = "console-error";
        span.textContent = "\n" + err;
        salidaConsola.appendChild(span);
      }
    }

    // Botones de accesos rápidos
    function insertarSimbolo(sym) {
      editor.focus();
      const doc = editor.getDoc();
      const cursor = doc.getCursor();

      if (sym === 'NAV_LEFT') {
        if (cursor.ch > 0) doc.setCursor({ line: cursor.line, ch: cursor.ch - 1 });
        return;
      }
      if (sym === 'NAV_RIGHT') {
        doc.setCursor({ line: cursor.line, ch: cursor.ch + 1 });
        return;
      }
      if (sym === 'TAB') {
        doc.replaceSelection('    ');
        return;
      }

      doc.replaceRange(sym, cursor);
      if (sym === '()' || sym === '[]' || sym === '{}' || sym === "''" || sym === '""') {
        doc.setCursor({ line: cursor.line, ch: cursor.ch + 1 });
      } else if (sym === 'print()') {
        doc.setCursor({ line: cursor.line, ch: cursor.ch + 6 });
      } else {
        doc.setCursor({ line: cursor.line, ch: cursor.ch + sym.length });
      }
    }

    document.querySelectorAll('.sym-btn').forEach(btn => {
      btn.addEventListener('click', () => insertarSimbolo(btn.getAttribute('data-sym')));
    });

    const overlay = document.getElementById('overlay');
    const sidebar = document.getElementById('sidebar');

    function toggleSidebar(abrir) {
      overlay.classList.toggle('activo', abrir);
      sidebar.classList.toggle('abierto', abrir);
    }

    document.getElementById('btnCarpeta').addEventListener('click', () => toggleSidebar(true));
    document.getElementById('btnCerrarSidebar').addEventListener('click', () => toggleSidebar(false));
    overlay.addEventListener('click', () => toggleSidebar(false));
    document.getElementById('btnEjecutar').addEventListener('click', ejecutarCodigo);
    document.getElementById('btnLimpiarConsola').addEventListener('click', () => {
      salidaConsola.textContent = '';
      estadoEjecucion.textContent = 'Listo';
    });

    document.getElementById('btnNuevoScript').addEventListener('click', () => {
      const nombre = prompt('Nombre del script:', 'script.py');
      if (nombre && !sistemaArchivos[nombre]) {
        sistemaArchivos[nombre] = '# Código Python 3\n';
        abrirArchivo(nombre);
      }
    });

    renderizarPestanas();
    renderizarArbolArchivos();
  </script>
</body>
</html>
