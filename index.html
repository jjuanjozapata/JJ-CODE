<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Python Móvil - IDE PWA</title>
  
  <link rel="icon" type="image/png" href="icono.png">
  <link rel="apple-touch-icon" href="icono.png">
  <link rel="manifest" href="manifest.json">
  
  <!-- CodeMirror 5 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/dialog/dialog.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/search/matchesonscrollbar.min.css">
  
  <!-- Skulpt 1.2.0 Core & Standard Library -->
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
  
  <!-- CodeMirror Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/anyword-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/search/searchcursor.min.js"></script>

  <style>
    :root {
      --bg-dark: #0f111a;
      --bg-surface: #1a1c23;
      --bg-toolbar: #24283b;
      --border-color: #2f354a;
      --text-main: #e0e6ed;
      --text-muted: #8a919e;
      --accent-color: #00e676;
      --accent-hover: #00c853;
      --danger-color: #ff5370;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      height: 100dvh;
      overflow: hidden;
      display: flex;
    }

    .app-wrapper {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    /* Toolbar superior */
    .top-toolbar {
      display: flex;
      align-items: center;
      background: var(--bg-toolbar);
      padding: 6px 10px;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
      height: 46px;
    }

    .icon-btn, .btn-replace-toggle {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 16px;
      padding: 6px;
      cursor: pointer;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:active {
      background: var(--border-color);
    }

    .search-pill {
      display: flex;
      align-items: center;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2px 8px;
      flex: 1;
      height: 32px;
      gap: 6px;
    }

    .search-pill input {
      background: none;
      border: none;
      color: var(--text-main);
      width: 100%;
      font-size: 13px;
      outline: none;
    }

    .search-badge {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .btn-ejecutar-play {
      background: var(--accent-color);
      color: #000;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Barra Reemplazo */
    .replace-bar {
      display: none;
      align-items: center;
      background: var(--bg-surface);
      padding: 6px 10px;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .replace-bar.activa {
      display: flex;
    }

    .replace-bar input {
      flex: 1;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
    }

    .replace-bar button {
      background: var(--bg-toolbar);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }

    /* Pestañas */
    .tab-bar {
      display: flex;
      background: var(--bg-dark);
      overflow-x: auto;
      border-bottom: 1px solid var(--border-color);
      scrollbar-width: none;
      height: 34px;
    }

    .tab-bar::-webkit-scrollbar {
      display: none;
    }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-item.activa {
      background: var(--bg-dark);
      color: var(--accent-color);
      border-bottom: 2px solid var(--accent-color);
    }

    .tab-close {
      cursor: pointer;
      opacity: 0.6;
    }

    .tab-close:hover {
      opacity: 1;
    }

    /* Editor */
    .editor-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .CodeMirror {
      height: 100% !important;
      font-family: "JetBrains Mono", Menlo, Monaco, Consolas, monospace !important;
      background: #0f111a !important;
      color: #e0e6ed !important;
    }

    .CodeMirror-gutters {
      background: #0f111a !important;
      border-right: 1px solid var(--border-color) !important;
    }

    /* Barra de Símbolos y Accesos */
    .symbols-bar {
      display: flex;
      align-items: center;
      background: var(--bg-toolbar);
      overflow-x: auto;
      border-top: 1px solid var(--border-color);
      padding: 4px 6px;
      gap: 4px;
      scrollbar-width: none;
      height: 40px;
    }

    .symbols-bar::-webkit-scrollbar {
      display: none;
    }

    .sym-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 13px;
      font-family: monospace;
      cursor: pointer;
      white-space: nowrap;
    }

    .sym-btn:active {
      background: var(--accent-color);
      color: #000;
    }

    /* Barra de Estado */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-dark);
      padding: 2px 10px;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      height: 22px;
    }

    /* Consola */
    .console-panel {
      height: 35%;
      background: #08090d;
      border-top: 2px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-surface);
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
    }

    .console-body {
      flex: 1;
      padding: 8px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      user-select: text;
    }

    .console-output-error {
      color: var(--danger-color);
    }

    /* Sidebar y Overlays */
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 900;
      display: none;
    }

    .sidebar-overlay.activo {
      display: block;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100dvh;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease;
    }

    .sidebar.abierto {
      transform: translateX(280px);
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      font-weight: bold;
      font-size: 14px;
    }

    .sidebar-actions, .sidebar-backup-actions {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-btn {
      flex: 1;
      background: var(--bg-toolbar);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .file-item {
      display: flex;
      align-items: center;
      padding: 6px 16px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text-main);
    }

    .file-item:active, .file-item.activo {
      background: var(--border-color);
      color: var(--accent-color);
    }
  </style>
</head>
<body>

  <input type="file" id="inputSubirArchivos" multiple accept=".py,.json,.txt,.csv" style="display:none;">

  <!-- Overlay y Sidebar -->
  <div class="sidebar-overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span>EXPLORADOR PYTHON</span>
      <span id="btnCerrarSidebar" style="cursor: pointer; font-size: 16px; padding: 4px;">✕</span>
    </div>
    <div class="sidebar-actions">
      <button class="sidebar-btn" id="btnNuevoScript">🐍 + Script</button>
      <button class="sidebar-btn" id="btnCrearCarpeta">📁 + Carpeta</button>
    </div>
    <div class="sidebar-backup-actions">
      <button class="sidebar-btn" id="btnSubirArchivo" title="Subir archivo">📂 Importar</button>
      <button class="sidebar-btn" id="btnExportarWorkspace" title="Descargar copia">💾 Backup</button>
    </div>
    <div class="file-tree" id="listaArchivos"></div>
  </aside>

  <div class="app-wrapper">
    <!-- Barra Superior -->
    <header class="top-toolbar">
      <button class="icon-btn" id="btnCarpeta" title="Ver Archivos">📁</button>
      
      <div class="search-pill">
        <span>🔍</span>
        <input type="text" id="buscadorInput" placeholder="Buscar en código..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <span class="search-badge" id="badgeCoincidencias">0/0</span>
        <button class="btn-replace-toggle" id="btnToggleReplace" title="Reemplazar">⇄</button>
      </div>

      <button class="btn-ejecutar-play" id="btnEjecutar" title="Ejecutar Script">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </header>

    <!-- Barra de Búsqueda y Reemplazo -->
    <div class="replace-bar" id="barraReemplazo">
      <input type="text" id="inputReemplazo" placeholder="Reemplazar por..." autocomplete="off">
      <button id="btnReemplazarUno">Uno</button>
      <button id="btnReemplazarTodo">Todo</button>
    </div>

    <!-- Pestañas de Archivos -->
    <div class="tab-bar" id="contenedorPestanas"></div>

    <!-- Contenedor Editor CodeMirror -->
    <div class="editor-container" id="editorWrap">
      <textarea id="codigo"></textarea>
    </div>

    <!-- Barra de Accesos Rápidos para Móvil -->
    <div class="symbols-bar">
      <button class="sym-btn" data-sym="NAV_LEFT">◀</button>
      <button class="sym-btn" data-sym="NAV_RIGHT">▶</button>
      <button class="sym-btn" data-sym="TAB">TAB</button>
      <button class="sym-btn" data-sym=":">:</button>
      <button class="sym-btn" data-sym="=">=</button>
      <button class="sym-btn" data-sym="()">()</button>
      <button class="sym-btn" data-sym="[]">[]</button>
      <button class="sym-btn" data-sym="{}">{}</button>
      <button class="sym-btn" data-sym="''">''</button>
      <button class="sym-btn" data-sym='""'>""</button>
      <button class="sym-btn" data-sym="def ">def</button>
      <button class="sym-btn" data-sym="return ">return</button>
      <button class="sym-btn" data-sym="print()">print()</button>
      <button class="sym-btn" data-sym="UNDO">↶</button>
      <button class="sym-btn" data-sym="REDO">↷</button>
    </div>

    <!-- Barra de Estado Inferior -->
    <div class="status-bar">
      <span id="posicionCursor">&lt;/&gt; Python Lín 1, Col 1</span>
      <span id="estadoEjecucion">Listo</span>
    </div>

    <!-- Consola de Salida -->
    <div class="console-panel">
      <div class="console-header">
        <span>CONSOLA</span>
        <button class="icon-btn" id="btnLimpiarConsola" style="font-size: 11px;">Limpiar</button>
      </div>
      <div class="console-body" id="salidaConsola"></div>
    </div>
  </div>

  <script>
    // Registro de Service Worker para PWA Offline
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // Helper robusto para LocalStorage
    function safeParse(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw === null || raw === undefined) return fallback;
        return JSON.parse(raw);
      } catch (e) {
        console.warn(`safeParse: error parsing ${key}`, e);
        return fallback;
      }
    }

    // Sistema de Archivos Virtual (VFS)
    let sistemaArchivos = safeParse('py_archivos', {
      "prueba.py": `# Demostración de Hardware iOS y Archivos Virtuales
import ios
import modulos.operaciones as op

try:
    bateria = ios.get_bateria()
except Exception:
    bateria = "No disponible"

print('Batería del sistema:', bateria)
print('Suma desde módulo (2 + 3):', op.sumar(2, 3))

# Prueba del sistema de archivos local
with open("salida.txt", "w") as f:
    f.write("Guardado exitoso en el VFS")

with open("salida.txt", "r") as f:
    print("Lectura de archivo:", f.read())
`,
      "modulos/operaciones.py": `def sumar(a, b):
    return a + b

def restar(a, b):
    return a - b
`
    });

    let pestanasAbiertas = safeParse('py_pestanas', ["prueba.py", "modulos/operaciones.py"]);
    let archivoActual = localStorage.getItem('py_archivo_activo') || "prueba.py";
    let configuracionEditor = safeParse('py_config', {
      fontSize: "14px",
      tabSize: 4,
      lineWrapping: true
    });

    if (!sistemaArchivos[archivoActual]) archivoActual = Object.keys(sistemaArchivos)[0] || "prueba.py";
    pestanasAbiertas = pestanasAbiertas.filter(p => sistemaArchivos[p]);
    if (!pestanasAbiertas.includes(archivoActual)) pestanasAbiertas.push(archivoActual);

    const salidaConsola = document.getElementById("salidaConsola");
    const estadoEjecucion = document.getElementById("estadoEjecucion");

    // Inicialización de CodeMirror 5
    const editor = CodeMirror.fromTextArea(document.getElementById("codigo"), {
      mode: "python",
      lineNumbers: true,
      lineWrapping: configuracionEditor.lineWrapping,
      tabSize: configuracionEditor.tabSize,
      indentUnit: configuracionEditor.tabSize,
      autoCloseBrackets: true,
      inputStyle: "contenteditable",
      extraKeys: {
        "Ctrl-Space": "autocomplete",
        "Cmd-Enter": () => ejecutarCodigo(),
        "Ctrl-Enter": () => ejecutarCodigo()
      }
    });

    editor.getWrapperElement().style.fontSize = configuracionEditor.fontSize;
    editor.setValue(sistemaArchivos[archivoActual] || "");

    // Sincronización continua de cambios
    editor.on("change", () => {
      if (archivoActual) {
        sistemaArchivos[archivoActual] = editor.getValue();
        try {
          localStorage.setItem('py_archivos', JSON.stringify(sistemaArchivos));
        } catch (e) {
          console.warn('Error guardando en localStorage', e);
        }
      }
    });

    editor.on("inputRead", (cm, change) => {
      if (change.text && change.text[0] && change.text[0].match(/[a-zA-Z_]/)) {
        cm.showHint({ completeSingle: false });
      }
    });

    editor.on("cursorActivity", () => {
      const pos = editor.getCursor();
      const posEl = document.getElementById("posicionCursor");
      if (posEl) posEl.textContent = `</> Python Lín ${pos.line + 1}, Col ${pos.ch + 1}`;
    });

    // Gestión de Pestañas y Archivos
    function renderizarPestanas() {
      const contenedor = document.getElementById("contenedorPestanas");
      contenedor.innerHTML = "";
      pestanasAbiertas.forEach(archivo => {
        const tab = document.createElement("div");
        tab.className = `tab-item ${archivo === archivoActual ? "activa" : ""}`;
        tab.innerHTML = `<span>${archivo.split('/').pop()}</span><span class="tab-close" data-file="${archivo}">✕</span>`;
        tab.onclick = (e) => {
          if (e.target.classList.contains("tab-close")) {
            cerrarPestana(archivo);
          } else {
            abrirArchivo(archivo);
          }
        };
        contenedor.appendChild(tab);
      });
      localStorage.setItem('py_pestanas', JSON.stringify(pestanasAbiertas));
      localStorage.setItem('py_archivo_activo', archivoActual);
    }

    function renderizarArbolArchivos() {
      const lista = document.getElementById("listaArchivos");
      lista.innerHTML = "";
      Object.keys(sistemaArchivos).forEach(archivo => {
        const item = document.createElement("div");
        item.className = `file-item ${archivo === archivoActual ? "activo" : ""}`;
        item.textContent = archivo;
        item.onclick = () => {
          abrirArchivo(archivo);
          toggleSidebar(false);
        };
        lista.appendChild(item);
      });
    }

    function abrirArchivo(nombre) {
      if (sistemaArchivos[nombre] === undefined) return;
      archivoActual = nombre;
      if (!pestanasAbiertas.includes(nombre)) pestanasAbiertas.push(nombre);
      editor.setValue(sistemaArchivos[nombre]);
      renderizarPestanas();
      renderizarArbolArchivos();
    }

    function cerrarPestana(nombre) {
      pestanasAbiertas = pestanasAbiertas.filter(p => p !== nombre);
      if (archivoActual === nombre) {
        archivoActual = pestanasAbiertas[pestanasAbiertas.length - 1] || "";
        if (archivoActual) editor.setValue(sistemaArchivos[archivoActual]);
        else editor.setValue("");
      }
      renderizarPestanas();
    }

    // Módulo Nativo embebido Skulpt para iOS
   function builtinRead(x) {
  // 1. Módulo nativo ios
  if (x === "ios" || x === "ios.js" || x === "src/lib/ios.js") {
    return `
      var $builtinmodule = function(name) {
        var mod = {};
        var fnBateria = new Sk.builtin.func(function() {
          return new Sk.builtin.str("100% (Simulado PWA)");
        });
        mod.get_battery = fnBateria;
        mod.get_bateria = fnBateria;
        mod.vibrate = new Sk.builtin.func(function(ms) {
          if (navigator.vibrate) navigator.vibrate(Sk.ffi.remapToJs(ms) || 50);
          return Sk.builtin.none.none$;
        });
        return mod;
      };
    `;
  }

  // 2. Limpiar ruta de entrada
  let rutaBuscada = x.replace(/^\.\//, "");

  // 3. Coincidencia directa exacta en el VFS
  if (sistemaArchivos[rutaBuscada] !== undefined) {
    return sistemaArchivos[rutaBuscada];
  }

  // 4. Paquetes: simular __init__.py si la carpeta existe en el VFS
  if (rutaBuscada.endsWith("/__init__.py")) {
    let carpeta = rutaBuscada.replace("/__init__.py", "");
    let existeCarpeta = Object.keys(sistemaArchivos).some(k => k.startsWith(carpeta + "/"));
    if (existeCarpeta) {
      return sistemaArchivos[rutaBuscada] || "";
    }
  }

  // 5. Soporte para importación por puntos (ej: modulos.operaciones)
  let rutaPuntos = rutaBuscada.replace(/\.py$/, "").replace(/\//g, ".");
  for (let ruta in sistemaArchivos) {
    let virtualPuntos = ruta.replace(/\.py$/, "").replace(/\//g, ".");
    if (virtualPuntos === rutaPuntos || ruta === rutaBuscada) {
      return sistemaArchivos[ruta];
    }
  }

  // 6. Archivos estándar de Skulpt
  if (Sk.builtinFiles !== undefined && Sk.builtinFiles["files"][x] !== undefined) {
    return Sk.builtinFiles["files"][x];
  }

  throw "No se encontró el módulo: '" + x + "'";
}

      // Soporte para importación de módulos en subcarpetas del VFS
      let rutaLimpia = x.replace(/\.py$/, "").replace(/\//g, ".");
      for (let ruta in sistemaArchivos) {
        let rutaVirtual = ruta.replace(/\.py$/, "").replace(/\//g, ".");
        if (rutaVirtual === rutaLimpia || ruta === x) {
          return sistemaArchivos[ruta];
        }
      }

      if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
        throw "No se encontró el módulo: '" + x + "'";
      }
      return Sk.builtinFiles["files"][x];
    }

    // Configuración y Ejecución Skulpt 1.2.0
    function ejecutarCodigo() {
      salidaConsola.textContent = "";
      estadoEjecucion.textContent = "Ejecutando...";
      
      Sk.pre = "salidaConsola";
      Sk.configure({
        output: (texto) => {
          salidaConsola.textContent += texto;
          salidaConsola.scrollTop = salidaConsola.scrollHeight;
        },
        read: builtinRead,
        __future__: Sk.python3
      });

      const codigo = editor.getValue();
      const promise = Sk.misceval.asyncToPromise(() => {
        return Sk.importMainWithBody("<stdin>", false, codigo, true);
      });

      promise.then(() => {
        estadoEjecucion.textContent = "Terminado con éxito";
      }).catch((err) => {
        estadoEjecucion.textContent = "Error de ejecución";
        const msg = document.createElement("span");
        msg.className = "console-output-error";
        msg.textContent = "\n" + err.toString();
        salidaConsola.appendChild(msg);
      });
    }

    // Barra de Símbolos Rápida
    function insertarSimbolo(sym) {
      editor.focus();
      const doc = editor.getDoc();
      const cursor = doc.getCursor();

      if (sym === 'NAV_LEFT') {
        if (cursor.ch > 0) doc.setCursor({ line: cursor.line, ch: cursor.ch - 1 });
        else if (cursor.line > 0) {
          doc.setCursor({ line: cursor.line - 1, ch: editor.getLine(cursor.line - 1).length });
        }
        return;
      }
      if (sym === 'NAV_RIGHT') {
        const lineLen = editor.getLine(cursor.line).length;
        if (cursor.ch < lineLen) doc.setCursor({ line: cursor.line, ch: cursor.ch + 1 });
        else if (cursor.line < editor.lineCount() - 1) {
          doc.setCursor({ line: cursor.line + 1, ch: 0 });
        }
        return;
      }
      if (sym === 'UNDO') { editor.undo(); return; }
      if (sym === 'REDO') { editor.redo(); return; }
      if (sym === 'TAB') {
        doc.replaceSelection(' '.repeat(editor.getOption('tabSize') || 4));
        return;
      }

      doc.replaceRange(sym, cursor);
      if (sym === '()' || sym === '[]' || sym === '{}' || sym === '""' || sym === "''") {
        doc.setCursor({ line: cursor.line, ch: cursor.ch + 1 });
      } else if (sym === 'print()') {
        doc.setCursor({ line: cursor.line, ch: cursor.ch + 6 });
      } else {
        doc.setCursor({ line: cursor.line, ch: cursor.ch + sym.length });
      }
    }

    // Listeners de UI
    document.querySelectorAll('.sym-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const sym = btn.getAttribute('data-sym');
        if (sym) insertarSimbolo(sym);
      });
    });

    const overlay = document.getElementById('overlay');
    const sidebar = document.getElementById('sidebar');

    function toggleSidebar(abrir) {
      if (abrir) {
        overlay.classList.add('activo');
        sidebar.classList.add('abierto');
      } else {
        overlay.classList.remove('activo');
        sidebar.classList.remove('abierto');
      }
    }

    document.getElementById('btnCarpeta').addEventListener('click', () => toggleSidebar(true));
    document.getElementById('btnCerrarSidebar').addEventListener('click', () => toggleSidebar(false));
    overlay.addEventListener('click', () => toggleSidebar(false));

    document.getElementById('btnEjecutar').addEventListener('click', ejecutarCodigo);
    document.getElementById('btnLimpiarConsola').addEventListener('click', () => {
      salidaConsola.textContent = '';
      estadoEjecucion.textContent = 'Listo';
    });

    document.getElementById('btnNuevoScript').addEventListener('click', () => {
      const nombre = prompt('Nombre del nuevo archivo:', 'nuevo.py');
      if (nombre && !sistemaArchivos[nombre]) {
        sistemaArchivos[nombre] = '# Nuevo archivo Python\n';
        abrirArchivo(nombre);
      }
    });

    // Inicializar vistas
    renderizarPestanas();
    renderizarArbolArchivos();
  </script>
</body>
</html>
