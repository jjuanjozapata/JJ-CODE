<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Python Móvil - IDE PWA</title>
  
  <link rel="icon" type="image/png" href="icono.png">
  <link rel="apple-touch-icon" href="icono.png">
  <link rel="manifest" href="manifest.json">
  
  <!-- CodeMirror 5 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  
  <!-- Skulpt 1.2.0 Core & Standard Library -->
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
  
  <!-- CodeMirror Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>

  <style>
    :root {
      --bg-dark: #0f111a;
      --bg-surface: #1a1c23;
      --bg-toolbar: #1e222d;
      --border-color: #2b3040;
      --text-main: #e0e6ed;
      --text-muted: #8a919e;
      --accent-color: #00e676;
      --danger-color: #ff5370;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      height: 100dvh;
      overflow: hidden;
      display: flex;
    }

    .app-wrapper {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    .top-toolbar {
      display: flex;
      align-items: center;
      background: var(--bg-toolbar);
      padding: 6px 12px;
      gap: 10px;
      border-bottom: 1px solid var(--border-color);
      height: 48px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .search-pill {
      display: flex;
      align-items: center;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 3px 10px;
      flex: 1;
      height: 32px;
      gap: 6px;
    }

    .search-pill input {
      background: none;
      border: none;
      color: var(--text-main);
      width: 100%;
      font-size: 13px;
      outline: none;
    }

    .btn-ejecutar-play {
      background: var(--accent-color);
      color: #000;
      border: none;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .tab-bar {
      display: flex;
      background: var(--bg-dark);
      overflow-x: auto;
      border-bottom: 1px solid var(--border-color);
      scrollbar-width: none;
      height: 36px;
    }
    .tab-bar::-webkit-scrollbar { display: none; }

    .tab-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-item.activa {
      background: var(--bg-dark);
      color: var(--accent-color);
      border-bottom: 2px solid var(--accent-color);
    }

    .tab-close {
      cursor: pointer;
      padding: 2px;
    }

    .editor-container {
      flex: 1;
      position: relative;
      background: var(--bg-dark);
    }

    .CodeMirror {
      height: 100% !important;
      font-family: Menlo, Monaco, Consolas, monospace !important;
      font-size: 14px;
      background: #0f111a !important;
      color: #e0e6ed !important;
    }
    .CodeMirror-gutters {
      background: #0f111a !important;
      border-right: 1px solid var(--border-color) !important;
    }

    .symbols-bar {
      display: flex;
      align-items: center;
      background: var(--bg-toolbar);
      overflow-x: auto;
      border-top: 1px solid var(--border-color);
      padding: 4px 6px;
      gap: 5px;
      scrollbar-width: none;
      height: 42px;
    }
    .symbols-bar::-webkit-scrollbar { display: none; }

    .sym-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 13px;
      font-family: monospace;
      cursor: pointer;
      white-space: nowrap;
    }

    .sym-btn:active {
      background: var(--accent-color);
      color: #000;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-dark);
      padding: 2px 12px;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      height: 22px;
    }

    .console-panel {
      height: 35%;
      background: #08090d;
      border-top: 2px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-surface);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      border-bottom: 1px solid var(--border-color);
    }

    .console-body {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      font-family: Menlo, monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      user-select: text;
    }

    .console-error { color: var(--danger-color); }

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 900;
      display: none;
    }
    .sidebar-overlay.activo { display: block; }

    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100dvh;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease;
    }
    .sidebar.abierto { transform: translateX(280px); }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      border-bottom: 1px solid var(--border-color);
      font-weight: bold;
    }

    .sidebar-actions {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-btn {
      flex: 1;
      background: var(--bg-toolbar);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .file-tree {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .file-item {
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
    }
    .file-item.activo {
      background: var(--border-color);
      color: var(--accent-color);
    }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span>EXPLORADOR PYTHON</span>
      <span id="btnCerrarSidebar" style="cursor: pointer;">✕</span>
    </div>
    <div class="sidebar-actions">
      <button class="sidebar-btn" id="btnNuevoScript">🐍 + Script</button>
    </div>
    <div class="file-tree" id="listaArchivos"></div>
  </aside>

  <div class="app-wrapper">
    <header class="top-toolbar">
      <button class="icon-btn" id="btnCarpeta">📁</button>
      
      <div class="search-pill">
        <span>🔍</span>
        <input type="text" placeholder="Buscar..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>

      <button class="btn-ejecutar-play" id="btnEjecutar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </header>

    <div class="tab-bar" id="contenedorPestanas"></div>

    <div class="editor-container">
      <textarea id="codigo"></textarea>
    </div>

    <div class="symbols-bar">
      <button class="sym-btn" data-sym="NAV_LEFT">◀</button>
      <button class="sym-btn" data-sym="NAV_RIGHT">▶</button>
      <button class="sym-btn" data-sym="TAB">TAB</button>
      <button class="sym-btn" data-sym=":">:</button>
      <button class="sym-btn" data-sym="=">=</button>
      <button class="sym-btn" data-sym="()">()</button>
      <button class="sym-btn" data-sym="[]">[]</button>
      <button class="sym-btn" data-sym="{}">{}</button>
      <button class="sym-btn" data-sym="''">''</button>
      <button class="sym-btn" data-sym='""'>""</button>
      <button class="sym-btn" data-sym="def ">def</button>
      <button class="sym-btn" data-sym="return ">return</button>
      <button class="sym-btn" data-sym="print()">print()</button>
    </div>

    <div class="status-bar">
      <span id="posicionCursor">&lt;/&gt; Python Lín 1, Col 1</span>
      <span id="estadoEjecucion">Listo</span>
    </div>

    <div class="console-panel">
      <div class="console-header">
        <span>CONSOLA</span>
        <button class="icon-btn" id="btnLimpiarConsola" style="font-size: 11px;">Limpiar</button>
      </div>
      <div class="console-body" id="salidaConsola"></div>
    </div>
  </div>

  <script>
    function safeParse(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return (raw !== null && raw !== undefined) ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    let sistemaArchivos = safeParse('py_archivos', {
      "prueba.py": `# Demostración de Hardware iOS y Archivos Virtuales
import ios
import modulos.operaciones as op

# Probar vibración y hardware
ios.vibrate(60)
print('Batería:', ios.get_battery())

# Escritura de archivos locales con open()
with open('datos.txt', 'w') as f:
    f.write('Guardado desde Python!')

print('5 + 3 =', op.sumar(5, 3))
print('Archivo datos.txt creado con éxito.')
`,
      "modulos/operaciones.py": `def sumar(a, b):
    return a + b

def restar(a, b):
    return a - b
`
    });

    let pestanasAbiertas = safeParse('py_pestanas', ["prueba.py", "modulos/operaciones.py"]);
    let archivoActual = localStorage.getItem('py_archivo_activo') || "prueba.py";

    if (!sistemaArchivos[archivoActual]) archivoActual = Object.keys(sistemaArchivos)[0] || "prueba.py";
    pestanasAbiertas = pestanasAbiertas.filter(p => sistemaArchivos[p]);
    if (!pestanasAbiertas.includes(archivoActual)) pestanasAbiertas.push(archivoActual);

    const salidaConsola = document.getElementById("salidaConsola");
    const estadoEjecucion = document.getElementById("estadoEjecucion");

    // Inicializar CodeMirror 5
    let editor = CodeMirror.fromTextArea(document.getElementById("codigo"), {
      mode: "python",
      lineNumbers: true,
      lineWrapping: true,
      tabSize: 4,
      indentUnit: 4,
      autoCloseBrackets: true,
      inputStyle: "contenteditable",
      autocorrect: false,
      autocapitalize: false,
      spellcheck: false
    });

    editor.setValue(sistemaArchivos[archivoActual] || "");

    editor.on("change", () => {
      if (archivoActual) {
        sistemaArchivos[archivoActual] = editor.getValue();
        localStorage.setItem('py_archivos', JSON.stringify(sistemaArchivos));
      }
    });

    editor.on("cursorActivity", () => {
      const pos = editor.getCursor();
      document.getElementById("posicionCursor").textContent = `</> Python Lín ${pos.line + 1}, Col ${pos.ch + 1}`;
    });

    function renderizarPestanas() {
      const contenedor = document.getElementById("contenedorPestanas");
      contenedor.innerHTML = "";
      pestanasAbiertas.forEach(archivo => {
        const tab = document.createElement("div");
        tab.className = `tab-item ${archivo === archivoActual ? "activa" : ""}`;
        tab.innerHTML = `<span>${archivo.split('/').pop()}</span><span class="tab-close">✕</span>`;
        tab.onclick = (e) => {
          if (e.target.classList.contains("tab-close")) {
            cerrarPestana(archivo);
          } else {
            abrirArchivo(archivo);
          }
        };
        contenedor.appendChild(tab);
      });
      localStorage.setItem('py_pestanas', JSON.stringify(pestanasAbiertas));
      localStorage.setItem('py_archivo_activo', archivoActual);
    }

    function renderizarArbolArchivos() {
      const lista = document.getElementById("listaArchivos");
      lista.innerHTML = "";
      Object.keys(sistemaArchivos).forEach(archivo => {
        const item = document.createElement("div");
        item.className = `file-item ${archivo === archivoActual ? "activo" : ""}`;
        item.textContent = archivo;
        item.onclick = () => {
          abrirArchivo(archivo);
          toggleSidebar(false);
        };
        lista.appendChild(item);
      });
    }

    function abrirArchivo(nombre) {
      if (sistemaArchivos[nombre] === undefined) return;
      archivoActual = nombre;
      if (!pestanasAbiertas.includes(nombre)) pestanasAbiertas.push(nombre);
      editor.setValue(sistemaArchivos[nombre]);
      renderizarPestanas();
      renderizarArbolArchivos();
    }

    function cerrarPestana(nombre) {
      pestanasAbiertas = pestanasAbiertas.filter(p => p !== nombre);
      if (archivoActual === nombre) {
        archivoActual = pestanasAbiertas[pestanasAbiertas.length - 1] || "";
        if (archivoActual) editor.setValue(sistemaArchivos[archivoActual]);
        else editor.setValue("");
      }
      renderizarPestanas();
    }

    // Resolutor VFS con soporte completo para submódulos y paquetes
    function builtinRead(x) {
  // 1. Limpiar prefijos que agrega Skulpt internamente
  let ruta = x.replace(/^src\/lib\//, "").replace(/^\.\//, "");

  // 2. Si es el archivo exacto en el VFS
  if (sistemaArchivos[ruta] !== undefined) {
    return sistemaArchivos[ruta];
  }

  // 3. Si Skulpt busca __init__.py o __init__.js en una carpeta del VFS
  if (ruta.endsWith("/__init__.py") || ruta.endsWith("/__init__.js")) {
    let carpeta = ruta.replace(/\/__init__\.(py|js)$/, "");
    // Si algún archivo empieza con "carpeta/", confirmamos que la carpeta existe
    let existeCarpeta = Object.keys(sistemaArchivos).some(k => k.startsWith(carpeta + "/"));
    if (existeCarpeta) {
      return ""; // Devuelve módulo vacío para que Skulpt continúe
    }
  }

  // 4. Si la ruta viene con puntos (ej: modulos.operaciones)
  let rutaDesdePuntos = ruta.replace(/\.(py|js)$/, "").replace(/\./g, "/") + ".py";
  if (sistemaArchivos[rutaDesdePuntos] !== undefined) {
    return sistemaArchivos[rutaDesdePuntos];
  }

  // 5. Archivos nativos estándar de Skulpt
  if (Sk.builtinFiles && Sk.builtinFiles["files"][x] !== undefined) {
    return Sk.builtinFiles["files"][x];
  }

  throw "No se encontró el módulo: '" + x + "'";
}

      // Normalizar rutas
      let limpia = x.replace(/^src\/lib\//, "").replace(/^\.\//, "");

      // 2. Coincidencia directa en el VFS
      if (sistemaArchivos[limpia] !== undefined) {
        return sistemaArchivos[limpia];
      }

      // 3. Paquete o subdirectorio (__init__.py implícito)
      if (limpia.endsWith("/__init__.py") || limpia.endsWith("/__init__.js")) {
        let carpeta = limpia.replace(/\/__init__\.(py|js)$/, "");
        let existeEnVFS = Object.keys(sistemaArchivos).some(k => k.startsWith(carpeta + "/"));
        if (existeEnVFS) return "";
      }

      // 4. Búsqueda por notación de puntos (ej: modulos.operaciones)
      let sinExt = limpia.replace(/\.(py|js)$/, "");
      let rutaConPy = sinExt.replace(/\./g, "/") + ".py";
      if (sistemaArchivos[rutaConPy] !== undefined) {
        return sistemaArchivos[rutaConPy];
      }

      // 5. Archivos internos de la librería estándar de Skulpt
      if (Sk.builtinFiles !== undefined && Sk.builtinFiles["files"][x] !== undefined) {
        return Sk.builtinFiles["files"][x];
      }

      throw "No se encontró el módulo: '" + x + "'";
    }

    // Ejecución en Skulpt
    function ejecutarCodigo() {
      salidaConsola.textContent = "";
      estadoEjecucion.textContent = "Ejecutando...";
      
      Sk.pre = "salidaConsola";
      Sk.configure({
        output: (texto) => {
          salidaConsola.textContent += texto;
          salidaConsola.scrollTop = salidaConsola.scrollHeight;
        },
        read: builtinRead,
        __future__: Sk.python3
      });

      const codigo = editor.getValue();
      const promise = Sk.misceval.asyncToPromise(() => {
        return Sk.importMainWithBody("<stdin>", false, codigo, true);
      });

      promise.then(() => {
        estadoEjecucion.textContent = "Python Listo";
      }).catch((err) => {
        estadoEjecucion.textContent = "Error";
        const msg = document.createElement("span");
        msg.className = "console-error";
        msg.textContent = "\n[Error] " + err.toString();
        salidaConsola.appendChild(msg);
      });
    }

    // Botones de símbolos para móvil
    function insertarSimbolo(sym) {
      editor.focus();
      const doc = editor.getDoc();
      const cursor = doc.getCursor();

      if (sym === 'NAV_LEFT') {
        if (cursor.ch > 0) doc.setCursor({ line: cursor.line, ch: cursor.ch - 1 });
        return;
      }
      if (sym === 'NAV_RIGHT') {
        doc.setCursor({ line: cursor.line, ch: cursor.ch + 1 });
        return;
      }
      if (sym === 'TAB') {
        doc.replaceSelection('    ');
        return;
      }

      doc.replaceRange(sym, cursor);
      if (sym === '()' || sym === '[]' || sym === '{}' || sym === "''" || sym === '""') {
        doc.setCursor({ line: cursor.line, ch: cursor.ch + 1 });
      } else if (sym === 'print()') {
        doc.setCursor({ line: cursor.line, ch: cursor.ch + 6 });
      } else {
        doc.setCursor({ line: cursor.line, ch: cursor.ch + sym.length });
      }
    }

    document.querySelectorAll('.sym-btn').forEach(btn => {
      btn.addEventListener('click', () => insertarSimbolo(btn.getAttribute('data-sym')));
    });

    const overlay = document.getElementById('overlay');
    const sidebar = document.getElementById('sidebar');

    function toggleSidebar(abrir) {
      overlay.classList.toggle('activo', abrir);
      sidebar.classList.toggle('abierto', abrir);
    }

    document.getElementById('btnCarpeta').addEventListener('click', () => toggleSidebar(true));
    document.getElementById('btnCerrarSidebar').addEventListener('click', () => toggleSidebar(false));
    overlay.addEventListener('click', () => toggleSidebar(false));
    document.getElementById('btnEjecutar').addEventListener('click', ejecutarCodigo);
    document.getElementById('btnLimpiarConsola').addEventListener('click', () => {
      salidaConsola.textContent = '';
      estadoEjecucion.textContent = 'Listo';
    });

    document.getElementById('btnNuevoScript').addEventListener('click', () => {
      const nombre = prompt('Nombre del script:', 'script.py');
      if (nombre && !sistemaArchivos[nombre]) {
        sistemaArchivos[nombre] = '# Código Python\n';
        abrirArchivo(nombre);
      }
    });

    renderizarPestanas();
    renderizarArbolArchivos();
  </script>
</body>
</html>
